// One script in three files, joined in order by html.rs: this one (page
// set-up, menus, touch, pan, zoom pill and inspector), html_viewer_plan.js
// and html_viewer_3d.js, which closes the function opened here.
(function () {
  "use strict";
  // A saved page loads its plan and model from a companion `<stem>-data.js`
  // (which sets this global); a page made in one piece carries them inline.
  var external = window.__CADYAM_EXPORT_DATA__;
  var inline = document.getElementById("drawing");
  if (!external && !inline) {
    document.getElementById("plan-view").textContent =
      "This page's drawing data didn't load. Keep the -data.js file " +
      "that was saved with it in the same folder.";
    return;
  }
  var data = external ? external.drawing : JSON.parse(inline.textContent);
  if (external && external.planSvg) {
    document.getElementById("plan-view").innerHTML = external.planSvg;
  }
  var entities = data.entities || {};
  var picked = null;

  // ── View modes ──────────────────────────────────────────────────────
  var modeButtons = document.querySelectorAll(".modes button");
  function setMode(mode) {
    document.body.dataset.mode = mode;
    modeButtons.forEach(function (b) { b.classList.toggle("on", b.dataset.mode === mode); });
    window.dispatchEvent(new Event("resize"));
  }
  modeButtons.forEach(function (b) { b.addEventListener("click", function () { setMode(b.dataset.mode); }); });
  setMode(data.scene ? "split" : "2d");

  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  // A switch in a menu: its box, then its name.
  function chip(parent, label, input) {
    var l = el("label", { class: "row check" });
    l.appendChild(input);
    l.appendChild(document.createTextNode(label));
    parent.appendChild(l);
    return input;
  }
  // A setting in a menu: its name on the left, its control on the right.
  // Returns the control, and the name's node as `.caption`.
  function field(parent, label, input) {
    var l = el("label", { class: "row field" });
    var caption = el("span", null, label);
    l.appendChild(caption);
    l.appendChild(input);
    parent.appendChild(l);
    input.caption = caption;
    return input;
  }
  // A plain action in a menu (Zoom to fit, Reset view), which closes it.
  function action(parent, label, run) {
    var b = el("button", { class: "row item" }, label);
    b.addEventListener("click", function () { run(b); });
    parent.appendChild(b);
    return b;
  }
  // Each view's one Options button, opening a list of its settings.
  function optionsMenu(tools) {
    var menu = el("details", { class: "menu" });
    menu.appendChild(el("summary", null, "Options"));
    var list = el("div", { class: "menu-list" });
    menu.appendChild(list);
    tools.appendChild(menu);
    return list;
  }
  // A click anywhere outside an open menu closes it.
  document.addEventListener("click", function (ev) {
    document.querySelectorAll("details.menu[open]").forEach(function (m) {
      if (!m.contains(ev.target)) m.open = false;
    });
  });
  function typing(ev) {
    var t = ev.target.tagName;
    return t === "INPUT" || t === "SELECT" || t === "TEXTAREA";
  }

  // ── Touch ───────────────────────────────────────────────────────────
  // A touch screen (a coarse pointer, or the first finger seen) marks the
  // body `touch`: the walk pad and the gesture hints are for it alone, and
  // the Pan button drops its Space-key tooltip. A mouse sees none of it.
  var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  function touchy() { return document.body.classList.contains("touch"); }
  function markTouch() {
    document.body.classList.add("touch");
    panButtons.forEach(function (b) { b.title = "Pan"; });
  }
  function noteTouch(ev) { if (ev.pointerType === "touch" && !touchy()) markTouch(); }
  // Two quick taps in one spot: about 300 ms and 24 px apart at most.
  var TAP_GAP = 300, TAP_REACH = 24;
  // A tap on a view (pointerup `ev`, told by `recogniser`): see
  // CadYamTouch.tapOrDouble. Taps are timed by when they happened, not when
  // they are handled, so a slow first tap never pushes the second out of time.
  function tapOrDouble(recogniser, ev, single, double) {
    CadYamTouch.tapOrDouble(recogniser, {
      touch: ev.pointerType === "touch", x: ev.clientX, y: ev.clientY, t: ev.timeStamp
    }, single, double, TAP_GAP);
  }
  // A view's gesture hint, once per view: a card over it the first time a
  // finger lands, gone with ×, and not shown again once dismissed (where
  // the browser lets a page opened from disk remember anything).
  var hinted = {};
  function hintDismissed(key) {
    try { return window.localStorage.getItem("cadyam-hint-" + key) === "1"; } catch (e) { return false; }
  }
  function hint(section, key, text) {
    if (hinted[key] || hintDismissed(key)) return;
    hinted[key] = true;
    // One card per view: walking's hint takes the dollhouse's place.
    section.querySelectorAll(".touch-hint").forEach(function (c) { c.remove(); });
    var card = el("div", { class: "touch-hint", role: "note" });
    card.appendChild(el("span", null, text));
    var close = el("button", { class: "close", "aria-label": "Dismiss", title: "Dismiss" }, "×");
    close.addEventListener("click", function () {
      card.remove();
      try { window.localStorage.setItem("cadyam-hint-" + key, "1"); } catch (e) { /* not remembered */ }
    });
    card.appendChild(close);
    section.appendChild(card);
  }

  // ── Pan mode ────────────────────────────────────────────────────────
  // As in the app: the Pan button keeps it on; holding Space turns it on
  // while held. Dragging then moves the view, and a click picks nothing.
  // While walking through, Space jumps and flies instead (`spaceFlies`).
  var panLock = false, spaceHeld = false, spaceFlies = false, panButtons = [];
  function panning() { return panLock || spaceHeld; }
  function showPanning() {
    var on = panning();
    document.body.classList.toggle("panning", on);
    panButtons.forEach(function (b) { b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  }
  window.addEventListener("keydown", function (ev) {
    if (ev.key !== " " || typing(ev) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    // Not the page scrolling, nor a focused button clicking.
    ev.preventDefault();
    if (spaceFlies) return;
    if (!spaceHeld) { spaceHeld = true; showPanning(); }
  });
  window.addEventListener("keyup", function (ev) {
    if (ev.key !== " ") return;
    if (!typing(ev)) ev.preventDefault();
    spaceHeld = false;
    showPanning();
  });
  window.addEventListener("blur", function () { spaceHeld = false; showPanning(); });

  // ── Keyboard camera ─────────────────────────────────────────────────
  // Held arrows turn the dollhouse and W A S D slide it; over the plan both
  // slide (see CadYamKeys). In Split the keys go to the view the pointer
  // was last over or in. Each view registers `camViews[pane]`: `wants()`
  // (false while walking, which has its own keys) and `start()` (begin its
  // CadYamKeys.loop).
  var camPane = null, camViews = {};
  function camActivePane() {
    var mode = document.body.dataset.mode;
    return mode === "split" ? camPane || "3d" : mode;
  }
  var camHeld = CadYamKeys.heldKeys(window, function (ev) {
    var view = camViews[camActivePane()];
    if (typing(ev) || !view || !view.wants()) return false;
    view.start();
    return true;
  });
  function camHeldFor(pane) { return camActivePane() === pane ? camHeld : {}; }

  // A view's floating zoom pill, bottom right, as the app's: Pan, zoom out,
  // the zoom (click for 100%) and zoom in. `view` gives zoomBy(f), reset()
  // and percent() (null when zoom means nothing, as when walking).
  function zoomControls(section, view) {
    var bar = el("div", { class: "zoom-controls", role: "toolbar", "aria-label": "Zoom and pan" });
    var pan = el("button", { class: "pan", title: coarse ? "Pan" : "Pan (hold Space)", "aria-pressed": "false" }, "Pan");
    pan.addEventListener("click", function () { panLock = !panLock; showPanning(); });
    panButtons.push(pan);
    var out = el("button", { title: "Zoom out", "aria-label": "Zoom out" }, "−");
    var pct = el("button", { class: "pct", title: "Zoom to 100%" }, "100%");
    var inn = el("button", { title: "Zoom in", "aria-label": "Zoom in" }, "+");
    out.addEventListener("click", function () { view.zoomBy(1.25); });
    inn.addEventListener("click", function () { view.zoomBy(0.8); });
    pct.addEventListener("click", function () { view.reset(); });
    [pan, out, pct, inn].forEach(function (b) { bar.appendChild(b); });
    section.appendChild(bar);
    return {
      update: function () {
        var p = view.percent();
        pct.textContent = CadYamZoom.label(p);
        pct.disabled = p == null;
      }
    };
  }

  // ── Inspector ───────────────────────────────────────────────────────
  var inspector = document.getElementById("inspector");
  // The pin picked, by number, when a pin rather than an object is.
  var pickedPin = null;
  // Pins with a place in the drawing (a spot, an area or strokes): the
  // views draw these. A note on the app itself is only listed.
  var placed = data.pins.filter(function (p) { return p.spot; });
  function pinOf(number) { return data.pins.filter(function (p) { return p.number === number; })[0]; }
  function pinList() {
    if (!data.pins.length) return null;
    var box = el("div");
    box.appendChild(el("h3", null, "Pins"));
    var ul = el("ul", { class: "pins" });
    data.pins.forEach(function (p) {
      var li = el("li", { class: (p.done ? "done" : "") + (p.number === pickedPin ? " picked" : "") });
      var b = el("button", { title: p.spot ? "Show this pin" : "A note on the app, not on the drawing" });
      b.appendChild(el("strong", null, p.number + ". " + p.name));
      var where = [];
      if (!p.spot) where.push("Note on the app");
      if (p.done) where.push("Done");
      if (where.length) b.appendChild(el("span", { class: "where" }, where.join(" · ")));
      if (p.note) b.appendChild(el("div", null, p.note));
      b.addEventListener("click", function () { showPin(p.number); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }
  // The pin's markers in both views, highlighted when it is the one picked.
  function markPins() {
    document.querySelectorAll(".pin[data-pin]").forEach(function (n) {
      n.classList.toggle("picked", Number(n.dataset.pin) === pickedPin);
    });
  }
  // Pick pin `number`: name it and its note in the inspector and frame it
  // in both views.
  function showPin(number) {
    var p = pinOf(number);
    if (!p) return;
    picked = null;
    pickedPin = number;
    render();
    highlightPlan(null);
    model.select(null);
    markPins();
    if (p.spot) {
      framePlan(p);
      model.frame(p);
    }
  }
  // A card over the views that opens on a pick and closes with ×; with
  // nothing picked it lists the drawing's pins, when it has any.
  function inspect(id) {
    picked = id;
    pickedPin = null;
    render();
    highlightPlan(id);
    model.select(id);
    markPins();
  }
  function render() {
    inspector.textContent = "";
    var e = picked != null ? entities[picked] : null;
    var pin = pickedPin != null ? pinOf(pickedPin) : null;
    var close = el("button", { class: "close", "aria-label": "Close", title: "Close" }, "×");
    close.addEventListener("click", function () { inspect(null); });
    inspector.appendChild(close);
    if (pin) {
      inspector.appendChild(el("h2", null, pin.name));
      var at = "Pin " + pin.number + (pin.done ? " · done" : "") + (pin.spot ? "" : " · note on the app");
      inspector.appendChild(el("p", { class: "pin-at" }, at));
      if (pin.note) inspector.appendChild(el("p", { class: "note" }, pin.note));
    }
    if (e) {
      var id = picked;
      inspector.appendChild(el("h2", null, e.name));
      inspector.appendChild(el("p", { class: "kind" }, (e.kind || "Shape") + " · #" + id));
      var dl = el("dl");
      var rows = [["size", e.size]];
      if (e.layer) rows.push(["layer", e.layer]);
      if (e.phase && e.phase !== "existing") rows.push(["phase", e.phase]);
      rows = rows.concat(e.attrs);
      rows.forEach(function (r) { dl.appendChild(el("dt", null, r[0])); dl.appendChild(el("dd", null, r[1])); });
      inspector.appendChild(dl);
    }
    var pins = pinList();
    if (pins) inspector.appendChild(pins);
    inspector.hidden = !e && !pin && (!pins || pinsClosed);
    if (!e && !pin && pins) pinsClosed = true;
  }
  var pinsClosed = false;

  // (Viewer script, part 2 of 3: the 2D plan — follows html_viewer_controls.js.)
  // ── 2D plan ─────────────────────────────────────────────────────────
  var planView = document.getElementById("plan-view");
  var svg = planView.querySelector("svg");
  var planTools = document.getElementById("plan-tools");
  var NS = "http://www.w3.org/2000/svg";
  var vb = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  if (svg.classList.contains("painted")) {
    // The painting reaches past the plain plan's box (walls' faces, labels).
    var artG = svg.querySelector(":scope > g.art");
    var t = artG.transform.baseVal.consolidate();
    vb = CadYamPlanView.artBox(artG.getBBox(), t && t.matrix) || vb;
  }
  // A margin round the drawing, clear of the tool chips.
  vb = CadYamPlanView.padded(vb);
  var home = vb.slice();
  svg.setAttribute("viewBox", vb.join(" "));
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  // The canvas's painting of the plan, when the app exported one: its labels
  // stay their canvas size at any zoom, as the canvas's do.
  var art = svg.querySelector(":scope > g.art");
  var artPx = art ? Number(art.getAttribute("data-px-per-mm")) : 0;
  var labels = art ? art.querySelectorAll("g.label > text") : [];
  // Where the plan sits on screen, measured once and again only when the
  // page changes size: measuring on every pointer move forces the browser
  // to lay the page out again mid-drag.
  var svgBox = null;
  function planBox() {
    if (!svgBox || !svgBox.width) svgBox = svg.getBoundingClientRect();
    return svgBox;
  }
  function remeasure() { svgBox = null; labelZoom = 0; scaleLabels(); }
  window.addEventListener("resize", remeasure);
  window.addEventListener("scroll", function () { svgBox = null; }, true);
  if (window.ResizeObserver) new ResizeObserver(remeasure).observe(svg);
  // The zoom the labels were last scaled for: a pan leaves it alone, so
  // panning touches no label.
  var labelZoom = 0;
  function scaleLabels() {
    if (!labels.length) return;
    var r = planBox();
    // Screen pixels per recorded pixel.
    var z = CadYamPlanView.labelZoom(r.width, r.height, vb, artPx);
    if (!z || z === labelZoom) return;
    labelZoom = z;
    var t = CadYamPlanView.labelTransform(z);
    labels.forEach(function (n) { n.setAttribute("transform", t); });
  }
  var planZoom = null;
  // The view box is written once a frame, however many pointer or wheel
  // events arrive in it.
  var viewQueued = false;
  function setViewBox() {
    if (viewQueued) return;
    viewQueued = true;
    requestAnimationFrame(function () {
      viewQueued = false;
      svg.setAttribute("viewBox", vb.join(" "));
      scaleLabels();
      if (planZoom) planZoom.update();
    });
  }
  function toPlan(cx, cy) { return CadYamPlanView.toPlan(planBox(), vb, cx, cy); }
  function zoomPlan(cx, cy, f) {
    vb = CadYamPlanView.zoomBox(vb, toPlan(cx, cy), f);
    setViewBox();
  }
  planView.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    zoomPlan(ev.clientX, ev.clientY, CadYamZoom.wheelFactor(ev.deltaY, ev.deltaMode, ev.ctrlKey));
  }, { passive: false });
  // The zoom pill's steps go about the middle of the view.
  function planMiddle() {
    var r = planBox();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }
  planZoom = zoomControls(document.getElementById("plan"), {
    zoomBy: function (f) { var c = planMiddle(); zoomPlan(c[0], c[1], f); },
    // 100% is the drawing framed as the page opens, kept centred where it is.
    reset: function () {
      vb = CadYamPlanView.resetBox(vb, home);
      setViewBox();
    },
    percent: function () { return CadYamZoom.planPercent(home, vb); }
  });
  planZoom.update();
  // Held arrows or W A S D slide the plan.
  camViews["2d"] = {
    wants: function () { return true; },
    start: CadYamKeys.loop(function (dt) {
      var m = CadYamKeys.keyMotion(camHeldFor("2d"), "2d");
      if (!m.panX && !m.panY) return false;
      var r = planBox();
      vb = CadYamKeys.pan2dViewBox(vb, m.panX, m.panY, dt, !!camHeld.shift, r.width, r.height);
      setViewBox();
      return true;
    })
  };
  ["pointerenter", "pointerdown"].forEach(function (t) {
    planView.addEventListener(t, function () { camPane = "2d"; });
  });
  var planPointers = {};
  var planDrag = null;
  var planTap = CadYamTouch.tapper(TAP_GAP, TAP_REACH);
  planView.addEventListener("pointerdown", function (ev) {
    noteTouch(ev);
    if (ev.pointerType === "touch") hint(document.getElementById("plan"), "plan", "Drag to pan · Pinch to zoom · Double-tap to zoom in");
    var second = Object.keys(planPointers).length > 0;
    planPointers[ev.pointerId] = [ev.clientX, ev.clientY];
    planView.setPointerCapture(ev.pointerId);
    planView.classList.add("dragging");
    // A second finger makes it a pinch: lifting either is never a tap.
    if (second && planDrag) planDrag.moved = true;
    else planDrag = { x: ev.clientX, y: ev.clientY, moved: false, target: ev.target };
  });
  planView.addEventListener("pointermove", function (ev) {
    if (!planPointers[ev.pointerId]) return;
    var ids = Object.keys(planPointers);
    if (ids.length === 2) {
      // Pinch and slide at once: zoom about the fingers' midpoint, then
      // carry the plan along as the midpoint moves.
      var other = planPointers[ids[0] == ev.pointerId ? ids[1] : ids[0]];
      var g = CadYamTouch.pinch(planPointers[ev.pointerId], other, [ev.clientX, ev.clientY], other);
      if (g.scale !== 1) zoomPlan(g.mid[0], g.mid[1], g.scale);
      var ps = toPlan(0, 0)[2];
      vb[0] -= g.dx * ps;
      vb[1] -= g.dy * ps;
      setViewBox();
    } else if (planDrag) {
      var s = toPlan(0, 0)[2];
      var dx = ev.clientX - planPointers[ev.pointerId][0];
      var dy = ev.clientY - planPointers[ev.pointerId][1];
      if (CadYamPlanView.moved(planDrag, ev.clientX, ev.clientY)) planDrag.moved = true;
      vb[0] -= dx * s;
      vb[1] -= dy * s;
      setViewBox();
    }
    planPointers[ev.pointerId] = [ev.clientX, ev.clientY];
  });
  function planUp(ev) {
    delete planPointers[ev.pointerId];
    if (!Object.keys(planPointers).length) planView.classList.remove("dragging");
    if (CadYamPlanView.release(planDrag, Object.keys(planPointers).length, ev.type).picks) {
      // A tap picks what it lands on; a finger's double-tap zooms in 2×
      // about it instead.
      var target = planDrag.target, x = ev.clientX, y = ev.clientY;
      tapOrDouble(planTap, ev, function () {
        if (panning()) return;
        var pinHit = target.closest && target.closest(".pin[data-pin]");
        var hit = target.closest && target.closest('[id^="entity-"]');
        if (pinHit) showPin(Number(pinHit.dataset.pin));
        else inspect(hit ? hit.id.split("-")[1] : null);
      }, function () { zoomPlan(x, y, 0.5); });
    }
    // The finger left after a pinch carries on panning from where it is.
    if (!Object.keys(planPointers).length) planDrag = null;
  }
  planView.addEventListener("pointerup", planUp);
  planView.addEventListener("pointercancel", planUp);

  function entityNodes(id) {
    return svg.querySelectorAll('[id="entity-' + id + '"], [id^="entity-' + id + '-"], [data-e="' + id + '"]');
  }
  function highlightPlan(id) {
    svg.querySelectorAll(".picked").forEach(function (n) { n.classList.remove("picked"); });
    if (id != null) entityNodes(id).forEach(function (n) { if (n.id) n.classList.add("picked"); });
  }

  // The plan's Options: Zoom to fit, Pins and Layers.
  var planOptions = optionsMenu(planTools);
  action(planOptions, "Zoom to fit", function (b) {
    vb = home.slice();
    setViewBox();
    b.closest("details").open = false;
  });

  // The kinds switched off in Layers. (A renovation's phases are the Show
  // switch's, below.)
  var hiddenKinds = {};
  function applyVisibility() {
    Object.keys(entities).forEach(function (id) {
      var hide = !!hiddenKinds[entities[id].kindId];
      entityNodes(id).forEach(function (n) { n.style.display = hide ? "none" : ""; });
    });
  }

  // Layers: a fold in the Options listing each kind of object by its name.
  var planLayers = null;
  if (data.layers.length > 1) {
    var menu = el("details", { class: "sub" });
    var summary = el("summary", { class: "row" }, "Layers");
    menu.appendChild(summary);
    var list = el("div", { class: "sub-list" });
    var boxes = [];
    function count() {
      var off = boxes.filter(function (b) { return !b.checked; }).length;
      summary.textContent = off ? "Layers · " + off + " hidden" : "Layers";
    }
    var all = el("button", { class: "link" }, "Show all");
    all.addEventListener("click", function () {
      boxes.forEach(function (b) { b.checked = true; });
      hiddenKinds = {};
      count();
      applyVisibility();
    });
    list.appendChild(all);
    data.layers.forEach(function (l) {
      var box = el("input", { type: "checkbox" });
      box.checked = true;
      box.addEventListener("change", function () {
        hiddenKinds[l.id] = !box.checked;
        count();
        applyVisibility();
      });
      boxes.push(box);
      chip(list, l.label, box);
    });
    menu.appendChild(list);
    planLayers = menu;
  }

  // Pins: a traced area as a tinted patch, drawn strokes as lines and a
  // numbered dot at the spot, sized to the drawing; seen from above.
  function svgEl(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  // Pin `p`'s group in either view, named with its note on hover.
  function pinGroup(p) {
    var g = svgEl("g", { class: "pin" + (p.done ? " done" : ""), "data-pin": p.number });
    var title = svgEl("title", {});
    title.textContent = p.name + (p.note ? " — " + p.note : "");
    g.appendChild(title);
    return g;
  }
  if (placed.length) {
    var pinLayer = svgEl("g", { class: "pins" });
    var r = Math.max(home[2], home[3]) / 70;
    placed.forEach(function (p) {
      var g = pinGroup(p);
      if (p.region) g.appendChild(svgEl("path", { class: "area", d: CadYamPins.planPath(p.region, true) }));
      (p.strokes || []).forEach(function (s) { g.appendChild(svgEl("path", { class: "stroke", d: CadYamPins.planPath(s, false) })); });
      g.appendChild(svgEl("circle", { cx: p.spot[0], cy: -p.spot[1], r: r, "stroke-width": r / 6 }));
      var t = svgEl("text", { x: p.spot[0], y: -p.spot[1], "font-size": r * 1.1 });
      t.textContent = p.number;
      g.appendChild(t);
      pinLayer.appendChild(g);
    });
    svg.appendChild(pinLayer);
  }
  // Centre the plan on pin `p`, zooming out when what it covers would not fit.
  function framePlan(p) {
    vb = CadYamPins.fit(vb, CadYamPins.points(p));

  // (Viewer script, part 3 of 3: the 3D model, the Show switch and start-up —

  var FINISH = FINISH_GLSL;

  var PHASES = ["existing", "proposed", "demolish"];

  function layerPhase(g) {

      var p = layerPhase(g), tint = view.tints[p];

      g.classList.toggle("faded", !view.shows[p] && view.fade > 0);

    // object's phase.

      var e = entities[g.getAttribute("data-e")];

  var showButtons = [];
  if (data.phases) {
    var showNav = el("nav", { class: "modes show" });
    showNav.appendChild(el("span", null, "Show"));
    data.phases.views.forEach(function (v) {
      var b = el("button", { "data-view": v.name }, v.label);
      b.addEventListener("click", function () { showView(v); });

  function bytes(b64) {
    var s = atob(b64), out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  // ── The model's WebGL resources ─────────────────────────────────────
  // A linked WebGL2 program from vertex and fragment GLSL bodies (see
  // gl3d_shared.js, shared with Data Stories' 3D views). Every program
  // reads its corners from location 0 and phases from 1.
  function glProgram(gl, vs, fs) {
    return CadYamGl3d.program(gl, vs, fs, { aPos: 0, aPh: 1 });
  }

  // The model's two programs: `prog` draws it lit, shadowed, tinted and
  // patterned (or, picking, as object ids); `depthProg` is the sun's view,
  // depth only, to tell what each point is hidden behind.
  function modelPrograms(gl) {
    var prog = glProgram(gl,
      "in vec3 aPos; in vec3 aNrm; in vec3 aCol; in float aId; in float aPat; in float aPh; in float aPrint;\n" +
      "uniform mat4 uMvp; uniform mat4 uLight; uniform vec3 uSun; uniform float uTexel;\n" +
      "out vec3 vNrm; out vec3 vCol; out float vId; out vec3 vWorld; out vec4 vShadow; flat out int vPat; flat out int vPh;\n" +
      "flat out int vPrint;\n" +
      "void main(){ vNrm=aNrm; vCol=aCol; vId=aId; vWorld=aPos; vPat=int(aPat+0.5); vPh=int(aPh+0.5); vPrint=int(aPrint+0.5);\n" +
      // Looked up a texel or two off the face toward the sun, so a face doesn't shadow itself.
      " vec3 toward=aNrm*(dot(aNrm,uSun)<0.0 ? -1.0 : 1.0);\n" +
      " vShadow=uLight*vec4(aPos+toward*uTexel*1.5,1.0);\n" +
      " gl_Position=uMvp*vec4(aPos,1.0); }",
      "in vec3 vNrm; in vec3 vCol; in float vId; in vec3 vWorld; in vec4 vShadow; flat in int vPat; flat in int vPh;\n" +
      "uniform vec3 uSun; uniform float uCut; uniform float uSel; uniform int uPick;\n" +
      "uniform int uShadows; uniform highp sampler2DShadow uShadowMap; uniform float uFloor; uniform int uHasFloor;\n" +
      // Each phase shows or not, and is tinted toward its colour or not,
      // as the Show switch's view says.
      "uniform vec3 uShow; uniform vec3 uTintOn; uniform vec3 uTint[3]; uniform float uTintK;\n" +
      // A printed face's colour from its print's baked picture, laid as
      // the app lays a print: up an upright face, along x on a level one,
      // turned and repeated in real millimetres (along, across, cos, sin).
      "flat in int vPrint; uniform highp sampler2DArray uPrints; uniform vec4 uPrintAt[16];\n" +
      "vec3 print_colour(vec3 w, vec3 n, vec3 c){ if (vPrint==0) return c;\n" +
      " vec4 q=uPrintAt[vPrint-1]; vec3 a=abs(n);\n" +
      " vec2 p=a.z>=max(a.x,a.y) ? w.xy : (a.x>=a.y ? w.zy : w.zx);\n" +
      " vec2 u=vec2(p.x*q.z-p.y*q.w, p.x*q.w+p.y*q.z);\n" +
      " return texture(uPrints, vec3(u.x/q.x, -u.y/q.y, float(vPrint-1))).rgb; }\n" +
      "out vec4 o;\n" + FINISH + CadYamGl3d.LIGHT_GLSL +
      "float sunlit(vec3 n){ if (uShadows==0) return 1.0; return sunlit_at(uShadowMap, vShadow, n, uSun); }\n" +
      "void main(){ if (vWorld.z > uCut || uShow[vPh] < 0.5) discard;\n" +
      " if (uPick==1) { float i=vId; o=vec4(mod(i,256.0),mod(floor(i/256.0),256.0),floor(i/65536.0),255.0)/255.0; return; }\n" +
      " vec3 n=normalize(gl_FrontFacing ? vNrm : -vNrm);\n" +
      " float lit=uSun.z>0.0 && dot(n,uSun)>0.0 ? sunlit(n) : 0.0;\n" +
      " vec3 base=mix(print_colour(vWorld,vNrm,vCol),uTint[vPh],uTintOn[vPh]*uTintK);\n" +
      " vec3 c=shade(base,n,uSun,lit);\n" +
      " c*=pattern_light(vPat,vWorld,vNrm)*contact_light(vWorld,vNrm);\n" +
      " if (uSel>0.0 && abs(vId-uSel)<0.5) c=mix(c,vec3(1.0,0.48,0.0),0.55);\n" +
      " o=vec4(c,1.0); }");
    var depthProg = glProgram(gl,
      "in vec3 aPos; in float aPh; uniform mat4 uLight; out float vZ; flat out int vPh;\n" +
      "void main(){ vZ=aPos.z; vPh=int(aPh+0.5); gl_Position=uLight*vec4(aPos,1.0); }",
      "in float vZ; flat in int vPh; uniform float uCut; uniform vec3 uShow; out vec4 o;\n" +
      "void main(){ if (vZ > uCut || uShow[vPh] < 0.5) discard; o=vec4(1.0); }");
    return { prog: prog, depthProg: depthProg };

  // Per-corner data `arr`, `size` floats a corner, fed to `prog`'s
  // attribute `name` (skipped when the program does not read it).
  function glAttr(gl, prog, name, arr, size) {
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);

    if (loc >= 0) {

      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    }
    return b;
  }

  // Prints: each baked picture a layer of one repeating texture array on
  // unit 2 (one blank layer when there are none, so the sampler is whole),
  // with each one's period and turn in uPrintAt.
  function uploadPrints(gl, tiles, U) {
    var tpx = tiles.length ? tiles[0].px : 1;
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, gl.createTexture());
    gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, tpx, tpx, Math.max(tiles.length, 1), 0, gl.RGBA,
      gl.UNSIGNED_BYTE, null);

    tiles.forEach(function (tile, i) {
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, tpx, tpx, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes(tile.rgba));
      printAt.set([tile.along, tile.across, tile.cos, tile.sin], i * 4);

    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(U.uPrints, 2);
    gl.uniform4fv(U.uPrintAt, printAt);
  }

  // The shadow map's framebuffer: a `px` square depth texture on unit 1
  // (see gl3d_shared.js).
  function shadowTarget(gl, px) { return CadYamGl3d.shadowTarget(gl, px); }

  function make3d() {
    var V = CadYamModelView;
    var none = { select: function () {}, show: function () {}, frame: function () {} };
    var canvas = document.getElementById("model-view");
    var section = document.getElementById("model");
    var empty = section.querySelector(".empty");
    var gl = data.scene && canvas.getContext("webgl2", { antialias: true, preserveDrawingBuffer: true });
    if (!gl) {
      canvas.hidden = true;
      empty.hidden = false;
      if (data.scene) empty.textContent = "This browser can't show 3D (WebGL2 is off).";
      return none;
    }
    // The scene drawn: the page's own, or a Fashion size the Size switch
    // picked; a dress form's body and stand left out while it is hidden.
    var pos, col, own, pat, tph, prn, n, mesh;
    var shownScene = data.scene, formShown = true;
    function unpack(sc) {
      var t = CadYamFashion.triangles(sc, bytes, formShown);
      pos = t.pos; col = t.col; own = t.own; pat = t.pat; tph = t.tph; prn = t.prn;
      n = pos.length / 3;

    var box = V.bounds(pos), lo = box.lo, hi = box.hi;

        return glAttr(gl, prog, a[0], a[1], a[2]);

    }
    upload();

    // dress form shown or not.
    function reload(sc) {
      shownScene = sc;
      unpack(sc);
      gl.useProgram(prog);
      upload();
      rayGrid = null;
      shadowKey = null;
      redraw();
    }
    // A Fashion drawing's dress form controls: a badge naming the body the
    // form is shaped to, a graded stack's Size switch (`onSize` gets the
    // picked size's entry, to refit the form), and a "Dress form" chip in
    // `tools` (`onFormShown` gets whether it shows).
    function formTools(tools, F, onSize, onFormShown) {
      var modelTools = document.getElementById("model-tools");
      var badge = el("span", { class: "form-badge", id: "form-badge" });
      var showBody = function (entry) {
        badge.textContent = "Form: " + CadYamFashion.summary(entry.label, entry.measurements);
        badge.title = CadYamFashion.details(entry.measurements);
      };
      var choices = CadYamFashion.sizeOptions(F);
      if (choices.length) {
        var sizeSel = el("select", {
          id: "form-size", "aria-label": "Size",
          title: "See the pattern in another size, on that size's body"
        });
        choices.forEach(function (c) { sizeSel.appendChild(el("option", { value: c.value }, c.label)); });
        sizeSel.value = F.size;
        sizeSel.addEventListener("change", function () {
          var entry = CadYamFashion.sizeEntry(F, sizeSel.value);
          showBody(entry);
          onSize(entry);
          sizeSel.blur();
        });
        modelTools.appendChild(sizeSel);
      }
      modelTools.appendChild(badge);
      showBody(CadYamFashion.sizeEntry(F, F.size));
      if (CadYamFashion.hasForm(data.scene)) {
        var formBox = chip(tools, "Dress form", el("input", { type: "checkbox", id: "form-shown" }));
        formBox.checked = true;
        formBox.addEventListener("change", function () { onFormShown(formBox.checked); });

    }
    var U = {};
    ["uMvp", "uSun", "uCut", "uSel", "uPick", "uLight", "uTexel", "uShadows", "uShadowMap", "uFloor", "uHasFloor",
      "uShow", "uTintOn", "uTint", "uTintK", "uPrints", "uPrintAt"].forEach(function (u) {

    });
    var D = {
      uLight: gl.getUniformLocation(depthProg, "uLight"),
      uCut: gl.getUniformLocation(depthProg, "uCut"),
      uShow: gl.getUniformLocation(depthProg, "uShow")
    };
    gl.uniform1i(U.uShadowMap, 1);
    uploadPrints(gl, data.scene.printTiles || [], U);
    gl.uniform1f(U.uFloor, data.scene.floor == null ? 0 : data.scene.floor);
    gl.uniform1i(U.uHasFloor, data.scene.floor == null ? 0 : 1);
    gl.enable(gl.DEPTH_TEST);
    // Every phase, untinted, until a Show view says otherwise.
    var phaseShow = [1, 1, 1], tintOn = [0, 0, 0], tints = new Float32Array(9), tintK = 0;

    // The shadow map: the scene's depth as the sun sees it, redrawn only
    // when the sun or the cutaway moves.
    var SHADOW = 2048;
    var shadowFb = shadowTarget(gl, SHADOW);
    var shadowKey = null;

    var size = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) || 1;
    var centre = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
    var floor = Math.max(lo[2], Math.min(0, hi[2]));
    // The app's walk-through pace (mm, degrees and seconds), so the page
    // walks as CadYam does; a site wider than 60 m starts at a run.
    var W = data.walk;
    var site = V.isSite(lo, hi);
    var SPEEDS = [["Walk", 1], ["Run", 4], ["Fly", 12]];
    var pace = site ? 4 : 1;
    var cam = V.home(size, centre, box);
    var walk = { on: false, at: [0, 0, 0], yaw: Math.PI / 2, pitch: 0, floor: floor, velocity: [0, 0], spin: 0, lift: 0, rise: 0, flying: false };
    var cut = V.cutHeight(false, floor, hi[2]), sel = 0, shadows = true;
    // Where and when the sun stands: the site, and the day of the year and
    // clock hour the Sun date and time pick, as the app's view options do.
    var S = data.scene.sunConfig || { lat: 40, lon: 0, onMap: false, bearing: 0, day: 265, hour: 15 };
    var sunDay = S.day, sunHour = S.hour;
    // The drawing's own sun until the date or time moves it.
    var sunMoved = !data.scene.sun;
    function sunDir() {
      if (!sunMoved) return V.norm(data.scene.sun);
      return V.norm(CadYamSun.inPlan(S, sunDay, sunHour));
    }
    // The sun's camera: square on to the sun, framing the whole model.
    var radius = Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2 || 1;
    function drawShadows(sun, light) {
      // A phase the Show switch hides casts no shadow.
      var key = sun.join() + "|" + cut + "|" + phaseShow.join();
      if (key === shadowKey) return;
      shadowKey = key;
      gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFb);
      gl.viewport(0, 0, SHADOW, SHADOW);
      gl.clear(gl.DEPTH_BUFFER_BIT);
      gl.useProgram(depthProg);
      gl.uniformMatrix4fv(D.uLight, false, light);
      gl.uniform1f(D.uCut, cut);
      gl.uniform3fv(D.uShow, phaseShow);
      gl.enable(gl.POLYGON_OFFSET_FILL);
      gl.polygonOffset(2, 4);
      gl.drawArrays(gl.TRIANGLES, 0, n);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.useProgram(prog);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    // Walking sees W.fov side to side; the dollhouse 45° across the narrower side.
    function lens(w, h) { return V.lens(w, h, walk.on ? W.fov : null); }
    // The corners framing weighs: all of a small model's, a large one's
    // outermost and a sample (see html_walk.js).
    var hull = null;
    // Every corner of the model (not its box, so a sloping site fills the
    // view) within 85% of it (see html_model_view.js).
    function frame(w, h) {
      if (!hull) hull = CadYamWalk.outline(pos, 8000);
      var f = V.frame(hull, orbitDir(), lens(w, h), centre, size);
      cam.target = f.target;
      cam.dist = f.dist;
      cam.framed = true;
      homeDist = cam.dist;
    }
    // How far the framed view stands off: the zoom pill's 100%.
    var homeDist = 0;
    function orbitDir() { return V.orbitDir(cam.yaw, cam.pitch); }

    // The floor under a spot, up to the cutaway (see html_walk.js).
    var ground = CadYamWalk.ground(pos, size);
    function surfaces(x, y) { return ground.surfaces(x, y, cut); }
    function floorAt(x, y, from) { return ground.floorAt(x, y, from, cut); }
    function placeWalker() {
      // A site starts on its own ground at the near edge; a building from
      // a step back, looking at it.
      var xy = V.walkStart(lo, centre, size, site);
      walk.at = [xy[0], xy[1], 0];
      var under = surfaces(xy[0], xy[1]);
      walk.floor = under.length ? Math.min.apply(null, under) : floor;
      walk.yaw = Math.PI / 2; walk.pitch = 0; walk.velocity = [0, 0]; walk.spin = 0;

    placeWalker();

    function eye() { return V.eye(cam, walk, W.eye); }
    function forward() { return V.forward(cam, walk, eye()); }
    function matrix(w, h) {
      var c = V.clip(walk.on, cam.dist, size);
      return V.viewMatrix(eye(), forward(), lens(w, h), c[0], c[1]);
    }
    // The ray from the eye through canvas point (cx, cy), and the nearest
    // spot on the model it meets (or the ground, or nothing).
    function rayAt(cx, cy) {
      var r = canvas.getBoundingClientRect();
      return { from: eye(), dir: V.rayDir(r, cx, cy, forward(), lens(r.width, r.height)) };

    // How far along the ray from `o` in unit direction `d` it first meets
    // the model below the cutaway (Infinity if it never does).
    // Only the triangles in the cells the ray crosses are tried (see
    // html_walk.js); `far` stops the search past that distance.
    var rayGrid = null;
    function nearest(o, d, far) {
      if (!rayGrid) rayGrid = CadYamWalk.rays(pos);
      return rayGrid.nearest(o, d, cut, far);

    // True when the model hides world point `at` from `from`: something
    // stands clearly nearer along the line between them.
    function blocked(from, at) {
      var v = V.sub(at, from), dist = Math.hypot(v[0], v[1], v[2]);
      if (!dist) return false;
      var clear = V.clearance(dist);
      return clear > 0 && nearest(from, V.norm(v), clear) < clear;
    }

    // Pins over the model: an SVG laid on the canvas, each pin's area,
    // strokes and numbered marker projected from the camera on every draw,
    // so they stay crisp and clickable. One the model hides is faded.
    var overlay = null, pinNodes = [];
    if (placed.length) {
      overlay = svgEl("svg", { id: "model-pins" });
      placed.forEach(function (p) {
        var g = pinGroup(p);
        var area = p.region ? svgEl("path", { class: "area" }) : null;
        if (area) g.appendChild(area);
        var strokes = (p.strokes || []).map(function () { return g.appendChild(svgEl("path", { class: "stroke" })); });
        var dot = g.appendChild(svgEl("circle", { r: 11 }));
        var label = g.appendChild(svgEl("text", {}));
        label.textContent = p.number;
        dot.addEventListener("click", function () { showPin(p.number); });
        overlay.appendChild(g);
        pinNodes.push({ pin: p, g: g, area: area, strokes: strokes, dot: dot, label: label });
      });
      section.insertBefore(overlay, empty);
    }
    var pinsAt = "";
    function placePins(w, h) {
      if (!overlay) return;
      var M = matrix(w, h);
      // A redraw that left the camera where it was (a pick, a tint, the
      // cutaway) leaves the pins where they are.
      var key = w + "," + h + "," + cut + "," + M.join(",");
      if (key === pinsAt) return;
      pinsAt = key;
      function project(q) { return CadYamPins.project(M, w, h, q); }
      function path(pts, closed) { return CadYamPins.screenPath(pts, closed, project); }
      pinNodes.forEach(function (n) {
        if (n.area) n.area.setAttribute("d", path(n.pin.region, true));
        n.strokes.forEach(function (s, i) { s.setAttribute("d", path(n.pin.strokes[i], false)); });
        var s = project(n.pin.spot);
        n.dot.style.display = n.label.style.display = s ? "" : "none";
        if (s) {
          n.dot.setAttribute("cx", s[0]); n.dot.setAttribute("cy", s[1]);
          n.label.setAttribute("x", s[0]); n.label.setAttribute("y", s[1]);
        }
      });
      // Which pins the model hides, once the view settles: a ray per pin
      // is still too much for every frame of a drag.
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        var from = eye();
        pinNodes.forEach(function (n) { n.g.classList.toggle("hidden", blocked(from, n.pin.spot)); });
      }, 120);
    }
    var hideTimer = 0;
    // Turn the dollhouse to look at pin `p` from about where it is, close
    // enough that what it covers fills the middle of the view, swinging
    // round the model when the pin is hidden from this side.
    function framePin(p) {
      var box = CadYamPins.bounds(CadYamPins.points(p)), view = V.pinView(box[0], box[1], size);
      var c = view.target;
      if (walk.on) {
        walk.yaw = Math.atan2(c[1] - walk.at[1], c[0] - walk.at[0]);
        walk.pitch = 0;
        redraw();
        return;
      }
      cam.target = c;
      cam.dist = view.dist;
      var yaw = cam.yaw, yaws = V.pinYaws(yaw);
      for (var i = 0; i < yaws.length; i++) {
        cam.yaw = yaws[i];
        if (!blocked(eye(), p.spot)) break;
        if (i === yaws.length - 1) cam.yaw = yaw;
      }
      cam.moved = true;
      cam.framed = true;
      redraw();
    }
    var fb = null, fbTex = null, fbDepth = null, fbW = 0, fbH = 0;
    function draw(pick) {
      var w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      if (!cam.framed) frame(w, h);
      var sun = sunDir();
      // A sun below the horizon casts nothing.
      var casting = shadows && sun[2] > 0;
      var light = new Float32Array(V.lightMatrix(sun, centre, radius));
      if (casting && !pick) {
        var bound = gl.getParameter(gl.FRAMEBUFFER_BINDING);
        drawShadows(sun, light);
        gl.bindFramebuffer(gl.FRAMEBUFFER, bound);
      }
      var dpr = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      }
      gl.viewport(0, 0, canvas.width, canvas.height);
      if (pick) gl.clearColor(0, 0, 0, 1); else gl.clearColor(0.86, 0.91, 0.96, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.uniformMatrix4fv(U.uMvp, false, new Float32Array(matrix(w, h)));
      gl.uniformMatrix4fv(U.uLight, false, light);
      gl.uniform1f(U.uTexel, 2 * radius / SHADOW);
      gl.uniform1i(U.uShadows, casting ? 1 : 0);
      gl.uniform3fv(U.uSun, sun);
      gl.uniform1f(U.uCut, cut);
      gl.uniform1f(U.uSel, sel);
      gl.uniform1i(U.uPick, pick ? 1 : 0);
      gl.uniform3fv(U.uShow, phaseShow);
      gl.uniform3fv(U.uTintOn, tintOn);
      gl.uniform3fv(U.uTint, tints);
      gl.uniform1f(U.uTintK, tintK);
      gl.drawArrays(gl.TRIANGLES, 0, n);
      if (!pick) {
        placePins(w, h);
        modelZoom.update();
      }
    }
    var queued = false;
    function redraw() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () { queued = false; draw(false); });
    }
    function pickAt(cx, cy) {
      var r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      var w = canvas.width, h = canvas.height;
      if (!fb || fbW !== w || fbH !== h) {
        fb = gl.createFramebuffer(); fbTex = gl.createTexture(); fbDepth = gl.createRenderbuffer();
        gl.bindTexture(gl.TEXTURE_2D, fbTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindRenderbuffer(gl.RENDERBUFFER, fbDepth);
        gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbTex, 0);
        gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fbDepth);
        fbW = w; fbH = h;
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      draw(true);
      var px = new Uint8Array(4), at = V.pickPixel(r, cx, cy, dpr, h);
      gl.readPixels(at[0], at[1], 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      redraw();
      return V.pickedId(px);
    }

    // Orbit (drag), pan (right or shift drag), zoom toward the pointer
    // (wheel, trackpad pinch, + and -), double-click to fly to a spot; in
    // walk mode, drag looks around and W A S D or the arrows walk.
    var pointers = {}, drag = null;
    // Move the camera `f` times as far from model point `at`, keeping it
    // under the pointer. Close in, it pushes on through rather than stall.
    function zoomAbout(at, f) {
      cam.moved = true;
      V.zoomAbout(cam, at, f, size, forward());
    }
    var anchor = null, anchorAt = 0;
    function zoomAt(cx, cy, f) {
      // One spot per gesture: a burst of wheel events zooms about the point
      // first under the pointer, not a new hit on every tick.
      var now = performance.now();
      if (!anchor || now - anchorAt > 250 || Math.hypot(cx - anchor.x, cy - anchor.y) > 4) {
        // Off the model, zoom about the spot under the pointer as deep as
        // the point the camera turns about.
        var at = hitAt(cx, cy);
        if (!at) {
          var ray = rayAt(cx, cy);
          at = V.depthAnchor(ray.from, ray.dir, forward(), cam.dist);
        }
        anchor = { x: cx, y: cy, at: at };
      }
      anchorAt = now;
      zoomAbout(anchor.at, f);
      redraw();
    }
    function spin(dx, dy) {
      // A drag across the canvas turns about a full circle, whatever its size.
      var turned = V.spin(cam.yaw, cam.pitch, dx, dy, canvas.clientWidth);
      cam.yaw = turned[0];
      cam.pitch = turned[1];
    }
    canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
    // Slide the dollhouse's turning point so the model follows a drag of
    // `dx`, `dy` pixels.
    function panBy(dx, dy) {
      cam.target = V.panTarget(cam.target, eye(), cam.dist, canvas.clientHeight, dx, dy);
    }
    // Held arrows turn the dollhouse, W A S D slide it (W shows more of
    // what is above, D more to the right). Walking keeps its own keys.
    camViews["3d"] = {
      wants: function () { return !walk.on; },
      start: CadYamKeys.loop(function (dt) {
        if (walk.on) return false;
        var m = CadYamKeys.keyMotion(camHeldFor("3d"), "3d");
        if (!m.turn && !m.tilt && !m.panX && !m.panY) return false;
        var slow = !!camHeld.shift;
        var turned = CadYamKeys.orbitKeyStep(cam.yaw, cam.pitch, m.turn, m.tilt, dt, slow);
        cam.yaw = turned[0];
        cam.pitch = turned[1];
        var px = CadYamKeys.keyPanPx(dt, slow);
        if (m.panX || m.panY) panBy(-m.panX * px, m.panY * px);
        cam.moved = true;
        redraw();
        return true;
      })
    };
    ["pointerenter", "pointerdown"].forEach(function (t) {
      canvas.addEventListener(t, function () { camPane = "3d"; });
    });
    var modelTap = CadYamTouch.tapper(TAP_GAP, TAP_REACH);
    function touchHint() {
      hint(section, walk.on ? "walk" : "model", walk.on
        ? "Drag to look around · Use the pad to walk · Double-tap to stand there"
        : "Drag to orbit · Two fingers to pan and zoom · Double-tap to fly there");
    }
    canvas.addEventListener("pointerdown", function (ev) {
      noteTouch(ev);
      if (ev.pointerType === "touch") touchHint();
      var second = Object.keys(pointers).length > 0;
      pointers[ev.pointerId] = [ev.clientX, ev.clientY];
      canvas.setPointerCapture(ev.pointerId);
      // A second finger makes it a pinch: lifting either is never a tap.
      if (second && drag) drag.moved = true;
      else drag = { x: ev.clientX, y: ev.clientY, moved: false, pan: ev.button === 2 || ev.shiftKey || panning() };
      canvas.classList.add("dragging");
    });
    canvas.addEventListener("pointermove", function (ev) {
      var last = pointers[ev.pointerId];
      if (!last || !drag) return;
      var dx = ev.clientX - last[0], dy = ev.clientY - last[1];
      var ids = Object.keys(pointers);
      if (CadYamPlanView.moved(drag, ev.clientX, ev.clientY)) drag.moved = true;
      if (ids.length === 2) {
        var other = pointers[ids[0] == ev.pointerId ? ids[1] : ids[0]];
        var g = CadYamTouch.pinch(last, other, [ev.clientX, ev.clientY], other);
        if (walk.on) {
          // Two fingers pushed up the screen walk ahead, as a wheel does.
          step(-g.dy / 100 * W.speed * pace, 0);
        } else {
          // Pinch and slide at once: zoom about the midpoint, pan with it.
          if (g.scale !== 1) zoomAt(g.mid[0], g.mid[1], g.scale);
          panBy(g.dx, g.dy);
        }
      } else if (walk.on) {
        // As the app: 0.3° a pixel, looking no more than MAX_PITCH up or
        // down, or AIR_PITCH off the floor.
        var looked = V.look(walk.yaw, walk.pitch, dx, dy, CadYamWalk.airborne(walk) ? W.air_pitch : W.max_pitch);
        walk.yaw = looked[0];
        walk.pitch = looked[1];
      } else if (drag.pan) {
        panBy(dx, dy);
      } else {
        spin(dx, dy);
      }
      pointers[ev.pointerId] = [ev.clientX, ev.clientY];
      if (drag.moved) cam.moved = true;
      redraw();
    });
    function up(ev) {
      delete pointers[ev.pointerId];
      var none = !Object.keys(pointers).length;
      if (none) canvas.classList.remove("dragging");
      var lift = CadYamPlanView.release(drag, Object.keys(pointers).length, ev.type);
      if (placing && lift.tap) {
        placeAt(ev.clientX, ev.clientY);
      } else if (lift.picks) {
        // A tap picks what it lands on; a finger's double-tap flies there
        // (mobile browsers don't reliably send dblclick to a canvas that
        // takes every touch, so it is told here).
        var x = ev.clientX, y = ev.clientY;
        tapOrDouble(modelTap, ev, function () {
          if (panning()) return;
          var id = pickAt(x, y);
          inspect(id && entities[id] ? id : null);
        }, function () {
          touchFlew = performance.now();
          flyTo(x, y);
        });
      }
      // The finger left after a pinch carries on from where it is.
      if (none) drag = null;
    }
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
    canvas.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      // Lines and pages scroll in bigger steps than pixels; a trackpad
      // pinch arrives as a Ctrl+wheel of small deltas, so it counts more.
      var dy = V.wheelPx(ev.deltaY, ev.deltaMode, canvas.clientHeight);
      if (walk.on) {
        // A notch of the wheel walks half a second at the current pace.
        step(-dy / 200 * W.speed * pace, 0);
        redraw();
      } else {
        zoomAt(ev.clientX, ev.clientY, V.wheelZoom(dy, ev.ctrlKey));
      }
    }, { passive: false });
    // A double-click or double-tap at canvas point (cx, cy): fly the
    // dollhouse in to that spot, or, walking, stand there.
    var touchFlew = -Infinity;
    canvas.addEventListener("dblclick", function (ev) {
      // A browser that does send dblclick after a double-tap has flown already.
      if (performance.now() - touchFlew < 600) return;
      flyTo(ev.clientX, ev.clientY);
    });
    function flyTo(cx, cy) {
      var at = hitAt(cx, cy);
      if (!at) return;
      if (walk.on) {
        // Stand there, still facing the way you were.
        walk.at = [at[0], at[1], 0];
        walk.floor = floorAt(at[0], at[1], at[2]);
        CadYamWalk.land(walk, W);
      } else {
        cam.target = at;
        cam.moved = true;
        cam.dist = V.flyDist(cam.dist, size);
      }
      redraw();
    }
    // Walking moves as the app's walk-through does (see html_walk.js).
    function step(ahead, aside) { CadYamWalk.step(walk, ahead, aside, floorAt); }
    function advance(keys, dt) { CadYamWalk.advance(walk, keys, dt, W, pace, floorAt); }
    // `jumped`: Space went down since the last frame, read once.
    var held = {}, jumped = false, looping = false, last = 0;
    // The walk pad's push while a thumb is on it ({ ahead, aside }), else null.
    var touchStick = null;
    function keysHeld() {
      var jump = jumped && !held.shift;
      jumped = false;
      var keyAhead = (held.w || held.arrowup ? 1 : 0) - (held.s || held.arrowdown ? 1 : 0);
      var keyAside = (held.d ? 1 : 0) - (held.a ? 1 : 0);
      var go = CadYamTouch.steer(keyAhead, keyAside, touchStick);
      return {
        ahead: go.ahead,
        aside: go.aside,
        turn: (held.arrowright ? 1 : 0) - (held.arrowleft ? 1 : 0),
        slow: !!held.shift,
        // Space rises, Shift+Space sinks.
        rise: held[" "] ? (held.shift ? -1 : 1) : 0,
        jump: jump
      };
    }
    window.addEventListener("keydown", function (ev) {
      if (typing(ev) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (!walk.on) {
        if (placing && ev.key === "Escape") { setPlacing(false); return; }
        if (ev.key === "+" || ev.key === "=" || ev.key === "-" || ev.key === "_") {
          zoomAbout(cam.target, ev.key === "-" || ev.key === "_" ? 1.25 : 0.8);
          redraw();
        }
        return;
      }
      var key = ev.key.toLowerCase();
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift", " "].indexOf(key) < 0) return;
      // Space jumps and flies here, never scrolls the page.
      ev.preventDefault();
      if (key === " " && !ev.repeat) jumped = true;
      held[key] = true;
      startWalking();
    });
    function startWalking() {
      if (!looping) { looping = true; last = 0; requestAnimationFrame(tick); }
    }
    // The walk pad, bottom left while walking on a touch screen: a thumb
    // pushed up walks ahead, sideways steps aside, as W A S D do, and the
    // further it is pushed the faster it goes (see html_touch.js).
    var pad = el("div", { id: "walk-pad", "aria-label": "Walk pad" });
    var knob = el("div", { class: "knob" });
    pad.appendChild(knob);
    section.appendChild(pad);
    function padPush(ev) {
      var r = pad.getBoundingClientRect(), radius = r.width / 2;
      touchStick = CadYamTouch.stick(ev.clientX - (r.left + radius), ev.clientY - (r.top + radius), radius);
      knob.style.transform = "translate(" + touchStick.x + "px," + touchStick.y + "px)";
      startWalking();
    }
    function padRelease() {
      touchStick = null;
      knob.style.transform = "";
    }
    pad.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      pad.setPointerCapture(ev.pointerId);
      padPush(ev);
    });
    pad.addEventListener("pointermove", function (ev) { if (touchStick) padPush(ev); });
    pad.addEventListener("pointerup", padRelease);
    pad.addEventListener("pointercancel", padRelease);
    window.addEventListener("keyup", function (ev) { delete held[ev.key.toLowerCase()]; if (ev.key === "Shift") delete held.shift; });
    window.addEventListener("blur", function () { held = {}; });
    function tick(now) {
      var dt = last ? (now - last) / 1000 : 0;
      last = now;
      var keys = keysHeld();
      advance(keys, dt);
      draw(false);
      var moving = walk.velocity[0] || walk.velocity[1] || walk.spin || CadYamWalk.inAir(walk);
      if (walk.on && (keys.ahead || keys.aside || keys.turn || keys.rise || moving)) {
        requestAnimationFrame(tick);
      } else {
        looping = false;
      }
    }

    // The model's Options: walking, cutaway, sun and shadows, pins, reset.
    var tools = optionsMenu(document.getElementById("model-tools"));
    // Walk through first asks where to start: a click on the model stands
    // you there (a drag still turns it), Esc or Cancel gives up.
    var placing = false;
    var prompt = el("div", {
      id: "walk-prompt",
      style: "position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:6px 12px;" +
        "border-radius:6px;background:rgba(255,255,255,0.9);font:600 13px system-ui,sans-serif;" +
        "color:#222;pointer-events:none;display:none"
    }, "Click where you want to start");
    section.appendChild(prompt);
    function showWalkButton() {
      document.body.classList.toggle("walking", walk.on);
      if (!walk.on) padRelease();
      walkButton.classList.toggle("on", walk.on);
      walkButton.textContent = walk.on ? "Dollhouse" : placing ? "Cancel" : "Walk through";
      prompt.style.display = placing ? "" : "none";
      canvas.style.cursor = placing ? "crosshair" : "";
    }
    function setPlacing(on) {
      placing = on;
      prompt.textContent = (touchy() ? "Tap" : "Click") + " where you want to start";
      showWalkButton();
    }
    // Stand where canvas point (cx, cy) meets the model, facing the way
    // the dollhouse was looking; true when there was something there.
    function placeAt(cx, cy) {
      var at = hitAt(cx, cy);
      if (!at) {
        prompt.textContent = (touchy() ? "Tap" : "Click") + " on a floor or the ground to stand there";
        return false;
      }
      walk.at = [at[0], at[1], 0];
      walk.floor = floorAt(at[0], at[1], at[2]);
      walk.yaw = cam.yaw + Math.PI; walk.pitch = 0; walk.velocity = [0, 0]; walk.spin = 0;
      CadYamWalk.land(walk, W);
      walk.on = true; spaceFlies = true;
      setPlacing(false);
      redraw();
      return true;
    }
    var walkButton = action(tools, "Walk through", function (b) {
      if (walk.on) {
        walk.on = false; spaceFlies = false;
        showWalkButton();
        redraw();
        return;
      }
      setPlacing(!placing);
      // Out of the way of the click that places the walker.
      if (placing) b.closest("details").open = false;
    });
    // How fast walking goes: the app's pace, or quicker across a big site.
    var speed = el("select", { title: "Walking speed (hold Shift to go slow; Space jumps, hold it to fly upward)" });
    SPEEDS.forEach(function (s) { speed.appendChild(el("option", { value: s[1] }, s[0])); });
    speed.value = pace;
    speed.addEventListener("change", function () { pace = Number(speed.value); speed.blur(); });
    field(tools, "Speed", speed);
    // Only a model with storeys to see into has a cutaway worth offering.
    if (V.hasCutaway(floor, hi[2])) {
      var cutBox = chip(tools, "Cutaway", el("input", { type: "checkbox" }));
      cutBox.addEventListener("change", function () {
        cut = V.cutHeight(cutBox.checked, floor, hi[2]);
        redraw();
      });
    }
    // The sun's time of day (5 am to 9 pm, as the app's slider) and date.
    var time = field(tools, "Sun", el("input", {
      type: "range", min: "5", max: "21", step: "0.25", "aria-label": "Time of day"
    }));
    time.value = Math.max(5, Math.min(21, sunHour));
    function showTime() { time.caption.textContent = "Sun " + CadYamSun.hourLabel(sunHour); }
    showTime();
    time.addEventListener("input", function () {
      sunHour = Number(time.value);
      sunMoved = true;
      showTime();
      redraw();
    });
    var year = new Date().getFullYear();
    var date = field(tools, "Date", el("input", { type: "date", "aria-label": "Date" }));
    date.value = CadYamSun.dateValue(year, sunDay);
    date.addEventListener("change", function () {
      var d = CadYamSun.dayOfDate(date.value);
      if (!d) return;
      sunDay = d;
      sunMoved = true;
      redraw();
    });
    var shadowBox = chip(tools, "Shadows", el("input", { type: "checkbox" }));
    shadowBox.checked = shadows;
    shadowBox.addEventListener("change", function () { shadows = shadowBox.checked; redraw(); });
    if (data.fashion) {
      formTools(tools, data.fashion, function (entry) { reload(entry.scene || data.scene); },
        function (shown) { formShown = shown; reload(shownScene); });
    }
    pinsChip(tools);
    action(tools, "Reset view", function (b) {
      cam = V.home(size, centre, box);
      placeWalker();
      walk.on = false; spaceFlies = false; setPlacing(false);
      b.closest("details").open = false;
      redraw();
    });

    // The zoom pill: in the dollhouse, zoom about what the view turns on
    // (100% as framed); walking, its steps walk half a second on or back.
    var modelZoom = zoomControls(section, {
      zoomBy: function (f) {
        if (walk.on) step((f < 1 ? 1 : -1) * W.speed * pace * 0.5, 0);
        else zoomAbout(cam.target, f);
        redraw();
      },
      reset: function () {
        if (walk.on || !homeDist) return;
        cam.dist = homeDist;
        cam.moved = true;
        redraw();
      },
      percent: function () { return CadYamZoom.modelPercent(homeDist, cam.dist, walk.on); }
    });

    // Until the visitor moves it, the view stays framed as the canvas changes.
    window.addEventListener("resize", function () { if (!cam.moved) cam.framed = false; redraw(); });
    redraw();
    // Bucket the triangles for rays once the first picture is up, so the
    // first zoom toward the pointer doesn't wait on it.
    setTimeout(function () { if (!rayGrid) rayGrid = CadYamWalk.rays(pos); }, 400);
    return {
      select: function (id) { sel = id != null ? Number(id) + 1 : 0; redraw(); },
      frame: framePin,
      show: function (view, k) {
        var u = V.phaseUniforms(view);
        phaseShow = u.show;
        tintOn = u.tintOn;
        tints = new Float32Array(u.tints);
        tintK = k;
        redraw();
      }
    };
  }

  if (coarse) markTouch();
  inspect(null);
  scaleLabels();
  // A drawing with a model opens on it. The page starts in Split so the
  // plan is on screen while its box and labels are measured above (a hidden
  // plan measures 0 × 0); switching only now keeps 2D and Split framed.
  if (data.scene) setMode("3d");
})();
</script>
</body>
</html>
