/* vizkit's page styles. Every colour, font and space reads a theme token
   (--vk-*), written by vizkit_theme.js from the story's theme; the values
   after each var() are what the page shows before the theme lands. */
:root { color-scheme: light; }
:root[data-mode="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root[data-mode="auto"] { color-scheme: dark; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--vk-paper, #fbfaf7); color: var(--vk-ink, #1d2126);
  font-family: var(--vk-body-font, -apple-system, "Segoe UI", Roboto, Arial, sans-serif);
  font-size: var(--vk-body-size, 16px); line-height: var(--vk-body-leading, 1.5);
  font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
}
header, main, .warning {
  max-width: calc(var(--vk-wide, 1040px) + 4 * var(--vk-margin, 20px));
  margin-left: auto; margin-right: auto;
  padding-left: calc(2 * var(--vk-margin, 20px)); padding-right: calc(2 * var(--vk-margin, 20px));
}
header { padding-top: calc(5 * var(--vk-rhythm, 8px)); padding-bottom: var(--vk-rhythm, 8px); }
header h1, header .dek, header .byline { max-width: var(--vk-column, 640px); }
header h1 {
  margin: 0; font-family: var(--vk-headline-font); font-size: var(--vk-headline-size, 34px);
  font-weight: var(--vk-headline-weight, 700); line-height: var(--vk-headline-leading, 1.15);
  letter-spacing: var(--vk-headline-tracking, 0); text-transform: var(--vk-headline-case, none);
  text-wrap: balance;
}
.dek {
  margin: calc(1.5 * var(--vk-rhythm, 8px)) 0 0; color: var(--vk-ink-soft, #5b5852);
  font-family: var(--vk-dek-font); font-size: var(--vk-dek-size, 19px); font-weight: var(--vk-dek-weight, 400);
  line-height: var(--vk-dek-leading, 1.4); text-wrap: pretty;
}
.byline {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: calc(2 * var(--vk-rhythm, 8px)) 0 0; color: var(--vk-ink-soft, #6b7178);
  font-family: var(--vk-source-font); font-size: var(--vk-source-size, 13px);
}
.mode-toggle {
  margin-left: auto; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--vk-rule, #ddd); background: transparent; color: var(--vk-ink-soft, #666);
  font: inherit; font-size: 12px;
}
.mode-toggle:hover { color: var(--vk-ink); border-color: var(--vk-ink-soft); }
.warning {
  margin-top: 12px; padding-top: 10px; padding-bottom: 10px; border-radius: 8px;
  background: #fff4e0; border: 1px solid #f0c684; color: #7a4a00; font-size: 14px;
}
main { padding-top: var(--vk-rhythm, 8px); padding-bottom: calc(6 * var(--vk-rhythm, 8px)); }
.view { margin: calc(4 * var(--vk-rhythm, 8px)) 0 0; }
.view h2 {
  margin: 0 0 var(--vk-rhythm, 8px); max-width: var(--vk-column, 640px);
  font-family: var(--vk-title-font); font-size: var(--vk-title-size, 17px); font-weight: var(--vk-title-weight, 600);
  line-height: var(--vk-title-leading, 1.3); letter-spacing: var(--vk-title-tracking, 0);
  text-transform: var(--vk-title-case, none);
}
.plot { position: relative; width: 100%; user-select: none; touch-action: pan-y; cursor: crosshair; }
.plot.failed { color: #a12; height: auto !important; padding: 12px 0; cursor: default; }
.notes, .source {
  margin: calc(0.75 * var(--vk-rhythm, 8px)) 0 0; color: var(--vk-ink-soft, #6b7178);
  font-family: var(--vk-source-font); font-size: var(--vk-source-size, 12px); line-height: var(--vk-source-leading, 1.4);
}
.source + .notes, .notes + .source { margin-top: 2px; }
.empty { color: var(--vk-ink-soft, #6b7178); padding: 40px 0; text-align: center; }
.facets { display: grid; gap: calc(2 * var(--vk-rhythm, 8px)) calc(2 * var(--vk-rhythm, 8px)); }
.facet { min-width: 0; }
.facet-title {
  margin: 0 0 2px; font-family: var(--vk-annotation-font); font-size: var(--vk-annotation-size, 13px);
  font-weight: 600; color: var(--vk-ink, #222);
}
.legend-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 0 0 var(--vk-rhythm, 8px);
  font-family: var(--vk-axis-font); font-size: var(--vk-axis-size, 12px); color: var(--vk-ink-soft);
}
.legend-row .legend-title { font-weight: 600; color: var(--vk-ink); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; }
svg { overflow: visible; pointer-events: none; }
svg text { font-family: var(--vk-axis-font); }
svg .grid line { stroke: var(--vk-rule, #e6e3dc); stroke-width: 1; shape-rendering: crispEdges; }
svg .domain, svg .tick { stroke: var(--vk-ink-soft, #8d939a); stroke-opacity: 0.6; stroke-width: 1; shape-rendering: crispEdges; }
svg .tick-label, svg .legend-label {
  fill: var(--vk-ink-soft, #4b5158); font-size: var(--vk-axis-size, 12px); font-weight: var(--vk-axis-weight, 400);
  font-variant-numeric: tabular-nums;
}
svg .axis-title, svg .legend-title { fill: var(--vk-ink, #1d2126); font-size: var(--vk-axis-size, 12px); font-weight: 600; }
svg .mark-label { fill: var(--vk-ink, #1d2126); font-family: var(--vk-annotation-font); font-size: 11px; }
.tooltip {
  position: absolute; pointer-events: none; z-index: 10; min-width: 140px; max-width: 280px;
  padding: 9px 12px; border-radius: 8px; background: rgba(11, 15, 25, 0.96) !important; color: #f8fafc !important;
  border: 1px solid rgba(148, 163, 184, 0.35); backdrop-filter: blur(8px);
  font-family: var(--vk-annotation-font); font-size: 12px; line-height: 1.45; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
}
.tooltip b { font-weight: 700; color: #ffffff; margin-right: 4px; }
.view.picked h2 { color: #1f5fbf; }
.view.picked .plot { outline: 2px solid rgba(31, 95, 191, 0.35); outline-offset: 6px; border-radius: 4px; }
.picked-ring {
  position: absolute; pointer-events: none; z-index: 1; border: 2px solid #1f5fbf;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
}
.text-layer { pointer-events: none; overflow: hidden; }
.vk-text { position: absolute; white-space: nowrap; font-size: 12px; color: #1d2126; }
.module-error {
  padding: 12px 14px; border-radius: 8px; background: #fdecec; border: 1px solid #e7a3a3;
  color: #7c1d1d; font-size: 13px; line-height: 1.45; cursor: default;
}
.module-error b { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.module-error-message { margin-top: 4px; font-weight: 600; }
.module-error pre {
  margin: 8px 0 0; padding: 8px 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.7);
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: #4a1515;
}
.module-error.quiet { background: none; border: 0; padding: 12px 0; color: #6b7178; }
.module-slow {
  position: absolute; right: 8px; top: 8px; z-index: 3; padding: 4px 9px; border-radius: 999px;
  background: #fff4e0; border: 1px solid #f0c684; color: #7a4a00; font-size: 12px;
}
.hover-ring {
  position: absolute; pointer-events: none; border: 2px solid var(--vk-ink, #1d2126); border-radius: 50%;
  box-shadow: 0 0 0 2px var(--vk-paper, rgba(255, 255, 255, 0.85));
}
/* A phone: the headline and dek step down, the margins halve. */
@media (max-width: 600px) {
  header, main, .warning { padding-left: var(--vk-margin, 16px); padding-right: var(--vk-margin, 16px); }
  header { padding-top: calc(3 * var(--vk-rhythm, 8px)); }
  header h1 { font-size: calc(var(--vk-headline-size, 34px) * 0.72); }
  .dek { font-size: calc(var(--vk-dek-size, 19px) * 0.9); }
  .view { margin-top: calc(3 * var(--vk-rhythm, 8px)); }
}
/* Scrollytelling: a pinned graphic and the paragraphs that move it. */
.scrolly { position: relative; margin: 20px 0 0; }
.scrolly .graphic { position: sticky; top: 4vh; z-index: 0; }
.scrolly .graphic-inner { background: #fbfaf7; padding: 4px 0; }
.scrolly .beat-title { margin: 0 0 8px; font-size: 18px; font-weight: 600; min-height: 1.5em; }
.scrolly .stage { position: relative; width: 100%; }
.scrolly .stage .layer { position: absolute; left: 0; top: 0; width: 100%; }
.scrolly .stage canvas.morph { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; }
.scrolly .steps { position: relative; z-index: 1; padding: 30vh 0 40vh; }
.scrolly .step { min-height: 70vh; display: flex; align-items: center; outline: none; }
.scrolly .step .card {
  margin: 0; padding: 16px 18px; max-width: 420px; border-radius: 10px; background: #fff;
  border: 1px solid #e6e3dc; box-shadow: 0 2px 10px rgba(29, 33, 38, 0.06);
  font-size: 17px; line-height: 1.55; color: #4b5158; transition: color 0.2s, border-color 0.2s;
}
.scrolly .step.active .card { color: #1d2126; border-color: #2f6db5; }
.scrolly .step:focus-visible .card { box-shadow: 0 0 0 3px rgba(47, 109, 181, 0.35); }
.scrolly.reduced-motion .step .card { transition: none; }
/* Side by side: paragraphs on the left, the graphic pinned on the right. */
.scrolly.layout-side.mode-scroll { display: grid; grid-template-columns: minmax(240px, 1fr) 2.1fr; gap: 32px; }
.scrolly.layout-side.mode-scroll .steps { grid-column: 1; grid-row: 1; }
.scrolly.layout-side.mode-scroll .graphic { grid-column: 2; grid-row: 1; align-self: start; }
/* Overlay (and every phone): the graphic fills the width, cards scroll over it. */
.scrolly.layout-overlay.mode-scroll { display: grid; grid-template-columns: 1fr; }
.scrolly.layout-overlay.mode-scroll .graphic,
.scrolly.layout-overlay.mode-scroll .steps { grid-column: 1; grid-row: 1; }
.scrolly.layout-overlay .step { justify-content: center; pointer-events: none; }
.scrolly.layout-overlay .step .card { pointer-events: auto; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(2px); }
@media (max-width: 720px) {
  .scrolly.layout-side.mode-scroll { display: grid; grid-template-columns: 1fr; gap: 0; }
  .scrolly.layout-side.mode-scroll .graphic,
  .scrolly.layout-side.mode-scroll .steps { grid-column: 1; grid-row: 1; }
  .scrolly.layout-side .step { justify-content: center; pointer-events: none; }
  .scrolly .step .card { pointer-events: auto; max-width: 92%; background: rgba(255, 255, 255, 0.94); font-size: 16px; }
  main { padding: 8px 12px 48px; }
  header { padding: 20px 12px 4px; }
}
/* Stepper and autoplay: the text under the graphic, with next and back. */
.scrolly.mode-stepper, .scrolly.mode-autoplay { outline: none; }
.scrolly .caption { margin: 12px 0 0; min-height: 3.2em; font-size: 17px; line-height: 1.55; max-width: 720px; }
.scrolly .stepper-bar { display: flex; align-items: center; gap: 12px; margin: 10px 0 0; }
.scrolly .stepper-bar button {
  font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid #c9c4b8; background: #fff; color: #1d2126;
}
.scrolly .stepper-bar button:disabled { opacity: 0.4; cursor: default; }
.scrolly .stepper-bar .count { color: #6b7178; font-size: 14px; font-variant-numeric: tabular-nums; }
/* A video frame: the graphic alone, filling the frame; the Video app
   letters the beat's words as its caption. A tall frame is laid out for
   itself, the chart title larger and the plot nearer the top so the
   caption below has room. */
.scrolly.layout-video { margin: 0; padding: 4vh 5vw 0; }
.scrolly.layout-video .graphic { position: static; }
.scrolly.layout-video .beat-title { font-size: clamp(18px, 3.4vmin, 44px); margin-bottom: 2vh; }
.scrolly.layout-video .caption, .scrolly.layout-video .stepper-bar { display: none; }
:root[data-video] header, :root[data-video] .warning, :root[data-video] footer { display: none; }
/* Embedded (`<cadyam-viz>`): one visualization filling its frame, nothing
   around it. The host page owns headline, prose and background — the frame
   stays transparent unless the host sets --viz-bg. */
:root[data-embed], :root[data-embed] body {
  height: 100%; overflow: hidden; background: var(--viz-bg, transparent);
}
:root[data-embed] body { font-family: var(--viz-font, var(--vk-body-font, -apple-system, "Segoe UI", Roboto, Arial, sans-serif)); }
:root[data-embed] header, :root[data-embed] .warning, :root[data-embed] footer { display: none; }
:root[data-embed] main { max-width: none; padding: 0; margin: 0; }
.scrolly.layout-embed { margin: 0; padding: 0; }
.scrolly.layout-embed .graphic { position: static; height: 100vh; }
.scrolly.layout-embed .graphic-inner {
  height: 100%; max-width: none; padding: 0; margin: 0; border: 0; border-radius: 0;
  background: transparent; box-shadow: none;
}
.scrolly.layout-embed .beat-title { display: none; }
@media (max-aspect-ratio: 3/4) {
  .scrolly.layout-video { padding-top: 10vh; }
  .scrolly.layout-video .beat-title { font-size: clamp(22px, 5vmin, 56px); }
}
:root[data-theme="dark"] { color-scheme: dark; }
[data-theme="dark"] body { background: #16181b; color: #e6e8eb; }
[data-theme="dark"] .byline, [data-theme="dark"] .notes, [data-theme="dark"] .empty { color: #9aa1a9; }
[data-theme="dark"] .warning { background: #3a2a10; border-color: #7a5a20; color: #f3d9a4; }
[data-theme="dark"] .plot.failed { color: #ff8a8a; }
[data-theme="dark"] svg .grid line { stroke: #2c3036; }
[data-theme="dark"] svg .domain, [data-theme="dark"] svg .tick { stroke: #6b727a; }
[data-theme="dark"] svg .tick-label, [data-theme="dark"] svg .legend-label { fill: #b9bfc6; }
[data-theme="dark"] svg .axis-title, [data-theme="dark"] svg .legend-title, [data-theme="dark"] svg .mark-label { fill: #e6e8eb; }
[data-theme="dark"] .hover-ring { border-color: #e6e8eb; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.85); }
.capture-outlines { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; }
.capture-outline { position: absolute; border: 2px solid #e5262b; border-radius: 3px; background: rgba(229, 38, 43, 0.08); }
.capture-outline::after {
  content: attr(data-finding); position: absolute; top: -9px; right: -9px; min-width: 16px; height: 16px;
  padding: 0 3px; border-radius: 8px; background: #e5262b; color: #fff; font: 600 10px/16px sans-serif; text-align: center;
}
svg .span { fill: #ece7dc; opacity: 0.75; }
svg .threshold { stroke: #6b7178; stroke-width: 1.25; stroke-dasharray: 4 3; }
svg .bracket { fill: none; stroke: #4b5158; stroke-width: 1.25; }
svg .leader { fill: none; stroke: #4b5158; stroke-width: 1; }
svg .arrow { fill: none; stroke: #1d2126; stroke-width: 1.4; }
svg .arrow-head { fill: #1d2126; }
svg .anchor-dot { fill: #1d2126; stroke: #fff; stroke-width: 1.5; }
svg .annotation-halo { fill: rgba(251, 250, 247, 0.86); }
svg .annotation-text text { fill: #1d2126; font-size: 12px; }
svg .series-label { font-size: 12px; font-weight: 600; }
svg .series-tick { fill: none; stroke-width: 1; opacity: 0.7; }
svg .mark-value text { fill: #1d2126; font-size: 11px; font-variant-numeric: tabular-nums; }
svg .mark-value.inside text { fill: #fff; font-weight: 600; }
svg .marker { fill: #1d2126; }
svg .marker-number { fill: #fff; font-size: 11px; font-weight: 700; }
svg .lint-collision { fill: rgba(200, 40, 50, 0.08); stroke: #c8283a; stroke-width: 1.5; stroke-dasharray: 3 2; }
.annotation-notes { margin: 8px 0 0; padding-left: 22px; font-size: 13px; color: #1d2126; }
.annotation-notes li { margin: 2px 0; }
.annotation-notes li::marker { font-weight: 700; }
.swatch { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 2px; margin: 0 2px; vertical-align: -0.05em; }
.lint-report {
  margin: 8px 0 0; padding: 8px 12px; border-radius: 6px; background: #fdecee; border: 1px solid #e7a1a9;
  color: #7d1622; font-size: 13px;
}
.lint-report b { display: block; margin-bottom: 2px; }
body.framed {
  width: var(--frame-width); margin: 16px auto; background: #fbfaf7;
  outline: 1px solid #d8d4cb; box-shadow: 0 0 0 9999px #e9e6df;
}
body.framed header { padding: 20px 14px 4px; }
body.framed header h1 { font-size: 22px; }
body.framed main { padding: 4px 14px 32px; }
/* Reader controls: scrubbers, a player, dropdowns, chips, search, locate, draw. */
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin: 0 0 10px; }
.control { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: #4b5158; }
.control-label { display: inline-flex; align-items: center; gap: 6px; }
.control-value { color: #1d2126; font-size: 16px; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.control input[type=range] { width: min(360px, 60vw); accent-color: #2f6db5; }
.control-ends { color: #8d939a; font-size: 12px; font-variant-numeric: tabular-nums; }
.control select, .control input[type=search], .control input[type=text] {
  font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 6px; border: 1px solid #c9c4b8; background: #fff; color: #1d2126;
}
.control input[type=text] { width: 9em; }
.control button {
  font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid #c9c4b8; background: #fff; color: #1d2126;
}
.control button.go, .control button.play { background: #2f6db5; border-color: #2f6db5; color: #fff; }
.control button:disabled { opacity: 0.45; cursor: default; }
.control .chip { border-radius: 999px; padding: 4px 12px; border-color: var(--chip); color: #1d2126; }
.control .chip::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--chip); margin-right: 6px; }
.control .chip.off { opacity: 0.45; border-color: #c9c4b8; }
.control .chip.off::before { background: #c9c4b8; }
.control-count { color: #6b7178; font-size: 13px; }
.privacy { flex-basis: 100%; margin: 0; color: #8d939a; font-size: 12px; }
.locate-say, .draw-say { margin: 0 0 10px; font-size: 18px; line-height: 1.45; color: #1d2126; max-width: 720px; }
.locate-say:empty, .draw-say:empty { display: none; }
.you-rule { position: absolute; width: 0; border-left: 2px solid #c8414b; pointer-events: none; z-index: 1; }
.you-tag {
  position: absolute; top: -2px; left: 6px; white-space: nowrap; padding: 2px 7px; border-radius: 4px;
  background: #c8414b; color: #fff; font-size: 12px; font-weight: 600;
}
.you-rule.flip .you-tag { left: auto; right: 6px; }
svg.draw-layer { position: absolute; left: 0; top: 0; pointer-events: auto; z-index: 2; cursor: crosshair; touch-action: none; }
.revealed svg.draw-layer { cursor: default; }
.draw-zone { fill: rgba(47, 109, 181, 0.06); stroke: #9fb8d9; stroke-dasharray: 4 4; }
.draw-hint { fill: #2f6db5; font-size: 14px; font-weight: 600; }
.draw-guess { fill: none; stroke: #e0742a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.draw-guess.done { stroke-dasharray: 7 5; }
.draw-end { fill: #e0742a; stroke: #fff; stroke-width: 2; }
.draw-tag { fill: #b2561b; font-size: 12px; font-weight: 600; }
/* Brushing: the box, and the note on the view it picks rows in. */
.brush-box { position: absolute; pointer-events: none; z-index: 1; border: 1.5px solid #2f6db5; background: rgba(47, 109, 181, 0.1); }
.brush-note { margin: 0 0 8px; color: #6b7178; font-size: 13px; }
/* Small multiples: a grid of panels on one set of axes (.facets, .facet
   and .facet-title are the shared, themed rules above). */
.facet-head { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; margin: 0 0 2px; }
.facet-read { color: #c8414b; font-variant-numeric: tabular-nums; }
.facet.hovered .facet-title { color: #2f6db5; }
.facet-plot { position: relative; width: 100%; }
.facet-plot svg .tick-label { font-size: 10px; }
.facet-rule { position: absolute; width: 0; border-left: 1px solid #c8414b; pointer-events: none; z-index: 1; }
.facet-axes { margin: 8px 0 0; color: #6b7178; font-size: 13px; }
.tooltip .tip-value { color: #fff; margin: 0; }
/* 3D views: the canvas, labels placed over it at their box points, the
   3D lint's warning, and the frame-time readout a capture can show. */
.plot3d { cursor: grab; outline: none; overflow: hidden; border-radius: 6px; }
.plot3d:active { cursor: grabbing; }
.plot3d:focus-visible { box-shadow: 0 0 0 3px rgba(47, 109, 181, 0.35); }
.plot3d .canvas3d { position: absolute; left: 0; top: 0; }
.plot3d .labels3d { position: absolute; inset: 0; pointer-events: none; }
.plot3d .tick3d, .plot3d .title3d, .plot3d .focus3d {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-size: 11px; color: #4b5158; font-variant-numeric: tabular-nums;
}
.plot3d .tick3d.z { transform: translate(-110%, -50%); }
.plot3d .title3d { font-size: 12px; font-weight: 600; color: #1d2126; }
.plot3d .focus3d {
  transform: translate(-50%, -100%); padding: 2px 7px; border-radius: 4px;
  background: #1d2126; color: #fff; font-size: 12px; font-weight: 600;
}
.plot3d .lint3d {
  position: absolute; left: 10px; top: 10px; right: 10px; z-index: 2; margin: 0; max-width: 520px;
  padding: 8px 11px; border-radius: 7px; background: #fff4e0; border: 1px solid #f0c684;
  color: #7a4a00; font-size: 12.5px; line-height: 1.45;
}
.plot3d .hud3d {
  position: absolute; right: 10px; bottom: 10px; z-index: 2; padding: 3px 8px; border-radius: 5px;
  background: rgba(29, 33, 38, 0.82); color: #fff; font-size: 11.5px; font-variant-numeric: tabular-nums;
}
.plot3d .no-gl { padding: 24px; color: #6b7178; }
/* Maps: the GPU's regions and terrain, the marks' canvas over them, and a
   legend in the corner. */
.plot-map { overflow: hidden; border-radius: 6px; }
.plot-map .canvas-map, .plot-map .overlay-map { position: absolute; left: 0; top: 0; }
.plot-map .overlay-map { pointer-events: none; }
.plot-map .legend-map {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 12px;
  align-items: center; padding: 5px 9px; border-radius: 6px; background: var(--vk-paper, #fbfaf7);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06); font-size: 11.5px; color: var(--vk-ink, #1d2126);
  font-variant-numeric: tabular-nums; max-width: calc(100% - 20px);
}
.plot-map .legend-map .ramp { display: inline-block; width: 110px; height: 9px; border-radius: 2px; vertical-align: middle; }
.plot-map .legend-map .size { color: var(--vk-ink-soft, #6b7178); }
/* Presentation layout switcher in header */
.layout-bar {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: auto;
}
.layout-bar + .mode-toggle { margin-left: 4px; }
.layout-pill {
  padding: 3px 9px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--vk-rule, #ddd); background: transparent; color: var(--vk-ink-soft, #666);
  font: inherit; font-size: 11.5px; transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.layout-pill:hover { color: var(--vk-ink); border-color: var(--vk-ink-soft); }
.layout-pill.active {
  background: var(--vk-ink, #1d2126); color: var(--vk-paper, #fff); border-color: var(--vk-ink, #1d2126); font-weight: 600;
}
/* 1. Bento / Executive Dashboard Grid (layout-dashboard) */
body[data-layout="dashboard"] header,
body[data-layout="dashboard"] main,
body[data-layout="canvas"] header,
body[data-layout="canvas"] main,
body[data-layout="split"] header,
body[data-layout="split"] main {
  max-width: min(1440px, 96vw);
}
.kpi-strip {

  margin: 12px 0 22px;
}
.kpi-card {
  position: relative; padding: 14px 16px 12px; border-radius: 10px;

  border-top: 3px solid var(--kpi-accent, #2f6db5);

.kpi-label {

.kpi-value {

}
.kpi-sub {
  font-size: 12px; color: var(--vk-ink-soft, #6b7178); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

.bento-grid {

.bento-grid > .scrolly { grid-column: 1 / -1; margin-top: 0; }
.view.bento-card {

.view.bento-card.bento-span-2 { grid-column: 1 / -1; }
.bento-badge {

.view-beat-callout {
  margin: 4px 0 12px; padding: 8px 12px; border-radius: 6px;

/* 2. Editorial Magazine / Longform Feature (layout-magazine) */

.magazine-pair {

.magazine-tab.active {

.magazine-lead {

.scrolly.layout-magazine.mode-scroll,
.scrolly.layout-dashboard.mode-scroll {

}
.scrolly.layout-magazine .graphic,
.scrolly.layout-dashboard .graphic {
  position: relative; top: 0;
}
.scrolly.layout-magazine .steps,
.scrolly.layout-dashboard .steps {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;
  padding: 18px 0 8px;
}
.scrolly.layout-magazine .step,
.scrolly.layout-dashboard .step {

.scrolly.layout-magazine .step .card,
.scrolly.layout-dashboard .step .card {

/* 3. Full-Viewport Interactive Canvas / Poster Stage (layout-canvas) */
.scrolly.layout-canvas.mode-scroll {
  display: grid; grid-template-columns: 1fr;
}
.scrolly.layout-canvas.mode-scroll .graphic,
.scrolly.layout-canvas.mode-scroll .steps {
  grid-column: 1; grid-row: 1;
}
.scrolly.layout-canvas .graphic-inner {
  position: relative; padding: 16px 18px; border-radius: 14px;
  background: rgba(128, 128, 128, 0.05); border: 1px solid var(--vk-rule, #dcd8ce);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.08);
}
.scrolly.layout-canvas .steps {
  pointer-events: none; padding: 45vh 0 35vh;
}
.scrolly.layout-canvas .step {
  min-height: 60vh; opacity: 0; pointer-events: none;
}
.canvas-hud {
  margin-top: 12px; padding: 12px 16px; border-radius: 10px;
  background: rgba(29, 33, 38, 0.88); color: #f3f4f6;
  backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
}
.canvas-hud-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px;
}
.canvas-hud-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #7eb3f7;
}
.canvas-pills {
  display: inline-flex; align-items: center; gap: 5px;
}
.canvas-pill {
  min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08);
  color: #e5e7eb; font: inherit; font-size: 12px; font-weight: 600;
}
.canvas-pill:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
.canvas-pill.active { background: #2f6db5; border-color: #5a9cf2; color: #fff; }
.canvas-pill:disabled { opacity: 0.35; cursor: default; }
.canvas-hud-text {
  font-size: 15.5px; line-height: 1.5; color: #f9fafb; max-width: 820px;
}
.canvas-stage-wrap {
  display: grid; grid-template-columns: 1fr; gap: 24px;
}
.view.canvas-card {
  margin: 0; padding: 18px 20px; border-radius: 14px;
  background: rgba(128, 128, 128, 0.05); border: 1px solid var(--vk-rule, #dcd8ce);
}
/* 4. Dual-Pane Split Comparison / Explorer (layout-split) */
.split-explorer {
  display: grid; grid-template-columns: minmax(300px, 1.15fr) minmax(340px, 1fr); gap: 24px;
  align-items: start; margin-top: 12px;
}
.split-primary {
  position: sticky; top: 3vh;
}
.split-secondary {
  display: flex; flex-direction: column; gap: 20px;
}
.view.split-card {
  margin: 0; padding: 16px 18px; border-radius: 12px;
  background: rgba(128, 128, 128, 0.035); border: 1px solid var(--vk-rule, #e4e1d8);
}
.split-summary-card {
  padding: 18px 20px; border-radius: 12px;
  background: rgba(128, 128, 128, 0.04); border: 1px solid var(--vk-rule, #e4e1d8);
}
.split-summary-tag {
  font-size: 11px; font-weight: 700; letter-spacing: 0.07em; color: #2f6db5; margin-bottom: 6px;
}
.split-summary-lead {
  font-size: 16px; line-height: 1.5; margin-bottom: 14px; color: var(--vk-ink, #1d2126);
}
.split-summary-card .kpi-strip {
  grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 8px 0 0;
}
@media (max-width: 860px) {
  .bento-grid, .magazine-pair, .split-explorer { grid-template-columns: 1fr; }
  .split-primary { position: static; }
}

/* Hide mode-toggle and layout-bar switcher controls across exported stories */
#mode-toggle, .mode-toggle, .layout-bar {
  display: none !important;
}

/* ---- Distinct Top-of-Page Hero Structures & Photographic Grids ---- */
body[data-hero]:not([data-hero="standard"]) > header {
  display: none;
}

/* 1. Full-Bleed Photographic Magazine Cover (vk-hero-cover) */
.vk-hero-cover {
  position: relative; overflow: hidden; border-radius: 18px;
  min-height: 360px; margin: 8px 0 28px; display: flex; align-items: flex-end;
  color: #f8fafc; box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #334155 100%);
}
.vk-hero-cover-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center; opacity: 0.78;
}
.vk-hero-cover-scrim {
  position: relative; z-index: 1; width: 100%; padding: 48px 36px 28px;
  background: linear-gradient(180deg, rgba(8, 12, 24, 0.12) 0%, rgba(8, 12, 24, 0.82) 55%, rgba(8, 12, 24, 0.95) 100%);
}
.vk-hero-kicker {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.11em;
  text-transform: uppercase; color: #38bdf8; margin-bottom: 10px;
}
.vk-hero-cover .vk-hero-title {
  margin: 0 0 10px; font-size: clamp(28px, 3.6vw, 44px); font-weight: 800;
  line-height: 1.1; color: #ffffff; max-width: 820px; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
}
.vk-hero-cover .vk-hero-dek {
  margin: 0 0 20px; font-size: 18px; line-height: 1.45; color: #e2e8f0; max-width: 720px;
}
.vk-hero-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px;
  padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.18);
}
.vk-hero-stat strong {
  display: block; font-size: 22px; font-weight: 800; color: #fbbf24; line-height: 1.15;
}
.vk-hero-stat span {
  font-size: 11.5px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.05em;
}

/* 2. 50/50 Split Editorial & 2x2 Photo Mosaic (vk-hero-mosaic) */
.vk-hero-mosaic {
  display: grid; grid-template-columns: 1.05fr 1.15fr; gap: 28px; align-items: center;
  margin: 10px 0 30px; padding: 26px 28px; border-radius: 18px;
  background: rgba(128, 128, 128, 0.045); border: 1px solid var(--vk-rule, #e4e1d8);
}
.vk-hero-mosaic .vk-hero-title {
  margin: 0 0 12px; font-size: clamp(26px, 3.2vw, 38px); font-weight: 800; line-height: 1.12;
}
.vk-hero-mosaic .vk-hero-dek {
  margin: 0 0 16px; font-size: 17px; line-height: 1.5; color: var(--vk-ink-soft, #5b5852);
}
.vk-hero-quote {
  margin: 0; padding: 12px 16px; border-left: 3px solid #ec4899;
  background: rgba(236, 72, 153, 0.07); border-radius: 0 10px 10px 0;
  font-size: 14.5px; font-style: italic; line-height: 1.45;
}

/* 3. Compact Dark Engineering Telemetry Bar (vk-telemetry-bar) */
.vk-telemetry-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
  margin: 6px 0 16px; padding: 14px 20px; border-radius: 12px;
  background: #0f172a; color: #f8fafc; border: 1px solid rgba(56, 189, 248, 0.28);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
}
.vk-telemetry-left {
  display: flex; flex-direction: column; gap: 3px;
}
.vk-telemetry-kicker {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; color: #34d399;
}
.vk-telemetry-title {
  margin: 0; font-size: 21px; font-weight: 700; color: #ffffff;
}
.vk-telemetry-pills {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.vk-telemetry-pill {
  padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35); color: #bae6fd;
}

/* 4. Observatory HUD Banner (vk-observatory-banner) */
.vk-observatory-banner {
  margin: 6px 0 18px; padding: 20px 24px; border-radius: 14px;
  background: linear-gradient(90deg, rgba(15, 23, 42, 0.94) 0%, rgba(30, 41, 59, 0.88) 100%);
  border: 1px solid rgba(148, 163, 184, 0.22); color: #f8fafc;
}
.vk-observatory-title {
  margin: 0 0 6px; font-size: 26px; font-weight: 800; color: #ffffff;
}
.vk-observatory-dek {
  margin: 0; font-size: 15.5px; color: #cbd5e1; max-width: 780px;
}

/* 5. Cinema Marquee & Urban Broadsheet Masthead (vk-editorial-masthead) */
.vk-editorial-masthead {
  margin: 8px 0 24px; padding-bottom: 20px; border-bottom: 2px solid var(--vk-rule, #dcd8ce);
}
.vk-masthead-head {
  margin-bottom: 18px;
}
.vk-masthead-title {
  margin: 0 0 8px; font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; line-height: 1.12;
}
.vk-masthead-dek {
  margin: 0; font-size: 18px; color: var(--vk-ink-soft, #5b5852); max-width: 760px;
}

/* 6. Documentary & Archival Photo Grids (vk-photo-grid) */
.vk-photo-grid {
  display: grid; gap: 16px; margin: 18px 0 24px;
}
.vk-photo-grid.strip-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.vk-photo-grid.mosaic-2x2 {
  grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; gap: 12px;
}
.vk-photo-grid.split-mini-photos {
  grid-template-columns: 1fr; margin: 14px 0 0; gap: 10px;
}
.vk-photo-card {
  overflow: hidden; border-radius: 12px;
  background: rgba(128, 128, 128, 0.05); border: 1px solid var(--vk-rule, rgba(128, 128, 128, 0.2));
  display: flex; flex-direction: column;
}
.vk-photo-media {
  position: relative; height: 148px; overflow: hidden;
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
}
.mosaic-2x2 .vk-photo-media { height: 118px; }
.split-mini-photos .vk-photo-media { height: 108px; }
.vk-photo-media img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.vk-photo-tag {
  position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 6px;
  background: rgba(15, 23, 42, 0.86); color: #38bdf8;
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; backdrop-filter: blur(4px);
}
.vk-photo-body {
  padding: 10px 12px 12px;
}
.vk-photo-title {
  margin: 0 0 4px; font-size: 13.5px; font-weight: 700; line-height: 1.25;
}
.vk-photo-caption {
  margin: 0; font-size: 12px; line-height: 1.4; color: var(--vk-ink-soft, #6b7178);
}

/* Split Dossier Photo & Title */
.split-dossier-title {
  margin: 0 0 8px; font-size: 24px; font-weight: 800; line-height: 1.15;
}
.split-dossier-photo {
  margin: 12px 0 14px; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--vk-rule, rgba(128, 128, 128, 0.2));
  background: rgba(15, 23, 42, 0.06);
}
.split-dossier-photo img {
  width: 100%; height: 165px; object-fit: cover; display: block;
}
.split-dossier-caption {
  margin: 0; padding: 8px 11px; font-size: 12px; line-height: 1.4;
  color: var(--vk-ink-soft, #5b5852);
}

/* Interactive Beat Switcher Pills on Multi-Beat Cards */
.view-header-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.view-header-row h2 { margin: 0; }
.view-beat-pills {
  display: inline-flex; align-items: center; gap: 6px;
}
.view-beat-pill {
  padding: 3px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--vk-rule, #ccc); background: transparent;
  color: var(--vk-ink-soft, #666); font: inherit; font-size: 11.5px; font-weight: 600;
}
.view-beat-pill.active {
  background: #2f6db5; border-color: #2f6db5; color: #fff;
}

@media (max-width: 860px) {
  .vk-hero-mosaic, .vk-photo-grid.strip-3 { grid-template-columns: 1fr; }
}

/* ============================================================================
   DEMO #1 FLAGSHIP: HOLISTIC 35MM ANAMORPHIC CINEMA EXPERIENCE (cinema-gravity)
   ============================================================================ */
body[data-showcase="cinema-gravity"] {
  background: radial-gradient(ellipse at 50% 0%, rgba(245, 197, 24, 0.09) 0%, rgba(127, 29, 29, 0.07) 36%, #050509 75%) !important;
  background-color: #050509 !important;
  color: #f6f1e3 !important;
}
body[data-showcase="cinema-gravity"] main.story-main {
  max-width: 1360px !important;
  padding: 18px 28px 64px !important;
}

/* Anamorphic Widescreen Opening Title Sequence */
.vk-cinema-hero {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  margin: 6px 0 38px;
  background: #07070d;
  border: 1px solid rgba(245, 197, 24, 0.34);
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.78), 0 0 48px rgba(245, 197, 24, 0.08);
}
.vk-cinema-sprockets {
  height: 18px;
  background-color: #040408;
  background-image: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 12px,
    rgba(245, 197, 24, 0.24) 12px,
    rgba(245, 197, 24, 0.24) 24px,
    transparent 24px,
    transparent 34px
  );
  border-bottom: 1px solid rgba(245, 197, 24, 0.18);
}
.vk-cinema-sprockets.bottom {
  border-bottom: none;
  border-top: 1px solid rgba(245, 197, 24, 0.18);
}
.vk-cinema-hero-img {
  position: absolute;
  inset: 18px 0;
  width: 100%;
  height: calc(100% - 36px);

}
.vk-cinema-beam {

    linear-gradient(180deg, rgba(5, 5, 10, 0.42) 0%, rgba(5, 5, 10, 0.84) 62%, rgba(5, 5, 10, 0.97) 100%);

.vk-cinema-hero-stage {

}
.vk-cinema-cert {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 14px;
}
.vk-cinema-cert-badge {
  padding: 3px 10px;
  border-radius: 4px;
  background: rgba(245, 197, 24, 0.16);
  border: 1px solid rgba(245, 197, 24, 0.55);

  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.vk-cinema-cert-text {

  font-weight: 700;

}
.vk-cinema-title {
  margin: 0 0 12px;
  font-size: clamp(32px, 4.3vw, 54px);
  font-weight: 900;
  letter-spacing: -0.015em;
  line-height: 1.06;
  color: #fef9c3;
  text-shadow: 0 4px 28px rgba(0, 0, 0, 0.8), 0 0 32px rgba(245, 197, 24, 0.22);

}
.vk-cinema-dek {
  margin: 0 0 18px;
  font-size: 18px;
  line-height: 1.5;

}
.vk-cinema-billing {

  padding: 8px 18px;
  border-top: 1px solid rgba(245, 197, 24, 0.22);

  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: #94a3b8;

/* Perforated Golden Ticket Stubs */
.vk-cinema-tickets {

}
.vk-cinema-ticket {

  padding: 14px 16px;

.vk-ticket-serial {

}
.vk-ticket-val {
  display: block;
  font-size: 21px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -0.01em;

}
.vk-ticket-sub {
  display: block;
  font-size: 11.5px;
  color: #cbd5e1;
  line-height: 1.3;
}
.vk-cinema-scroll-cue {
  margin-top: 2px;
}
.vk-cinema-cue-pill {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 999px;
  background: rgba(245, 197, 24, 0.14);
  border: 1px solid rgba(245, 197, 24, 0.45);
  color: #fde047;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.vk-canopy-scanner-kicker {

  font-weight: 800;
  letter-spacing: 0.09em;
  color: #34d399;
  margin-bottom: 4px;
}
.vk-canopy-scanner-title {

  font-weight: 800;
  color: #ffffff;
}
.vk-canopy-scanner-fact {
  margin: 0 0 12px;
  font-size: 13.5px;
  line-height: 1.5;
  color: #d1fae5;
}
.vk-canopy-gauge-box {
  background: rgba(10, 31, 23, 0.9);
  border: 1px solid rgba(52, 211, 153, 0.25);
  border-radius: 8px;
  padding: 10px 12px;
}
.vk-canopy-gauge-hdr {
  font-size: 10.5px;
  font-weight: 800;
  color: #fde047;
  margin-bottom: 8px;
}
.vk-canopy-gauge-track {
  position: relative;
  height: 16px;
  background: rgba(2, 10, 7, 0.9);
  border-radius: 999px;
  border: 1px solid rgba(52, 211, 153, 0.3);
  overflow: visible;
}
.vk-canopy-gauge-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #059669 0%, #34d399 70%, #fbbf24 100%);
}
.vk-canopy-gauge-mark {
  position: absolute;
  top: -5px;
  bottom: -5px;
  border-left: 2px dashed #fbbf24;
}

  transform: translateX(-50%);
  font-size: 9.5px;
  font-weight: 800;
  color: #fde047;
  white-space: nowrap;
}

.vk-canopy-scanner-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

}
.vk-canopy-stat-card {
  background: rgba(11, 33, 24, 0.92);
  border: 1px solid rgba(52, 211, 153, 0.24);

  padding: 10px 12px;
}
.vk-canopy-stat-lbl {

  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;

  color: #6ee7b7;
}
.vk-canopy-stat-val {
  display: block;
  font-size: 15px;
  font-weight: 800;
  color: #ffffff;
  margin: 3px 0 2px;
}
.vk-canopy-stat-sub {
  display: block;
  font-style: normal;
  font-size: 11px;
  color: #fde047;
}

@media (max-width: 920px) {
  .vk-canopy-hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vk-canopy-scanner-grid { grid-template-columns: 1fr; }
}

  function detectShowcaseMeta(story, pageLayout) {
    // An embedded visualization carries no page chrome: the host owns it.
    if (pageLayout === 'embed') return null;
    var mods = story.modules || [];
    for (var i = 0; i < mods.length; i++) {
      if (SHOWCASE_META[mods[i].name]) return SHOWCASE_META[mods[i].name];
    }
    var views = story.views || [];
    for (var j = 0; j < views.length; j++) {
      if (views[j].module && SHOWCASE_META[views[j].module]) return SHOWCASE_META[views[j].module];
    }
    if (pageLayout === 'dashboard') return { hero: 'telemetry-bar', kicker: '● LIVE DATA TELEMETRY · EXECUTIVE BENTO', statusPills: [views.length + ' ACTIVE VIEWS'] };
    if (pageLayout === 'magazine') return { hero: 'photo-cover', kicker: 'LONGFORM FEATURE', coverFallback: 'linear-gradient(135deg, #1e293b 0%, #334155 100%)', stats: [] };
    if (pageLayout === 'split') return { hero: 'split-workbench', kicker: 'INTERACTIVE SPLIT WORKBENCH' };
    if (pageLayout === 'canvas') return { hero: 'observatory-hud', kicker: 'INTERACTIVE CANVAS STAGE' };
    return null;
  }

  function buildPhotoGrid(photos, cls) {
    if (!photos || !photos.length) return null;
    var grid = el('section', 'vk-photo-grid ' + (cls || ''));
    photos.forEach(function (p) {
      var card = el('article', 'vk-photo-card');
      var media = el('div', 'vk-photo-media');
      var img = document.createElement('img');
      img.src = p.url;
      img.alt = p.title || '';
      img.loading = 'lazy';
      img.onerror = function () { this.style.display = 'none'; };
      media.appendChild(img);
      if (p.tag) media.appendChild(el('span', 'vk-photo-tag', p.tag));
      card.appendChild(media);
      var body = el('div', 'vk-photo-body');
      if (p.title) body.appendChild(el('h3', 'vk-photo-title', p.title));
      if (p.caption) body.appendChild(el('p', 'vk-photo-caption', p.caption));
      card.appendChild(body);
      grid.appendChild(card);
    });
    return grid;
  }

// page around it. The host page — written by whoever embeds it — drives it
// by postMessage and hears back what the reader does:
//
//   host → frame  {ns:'cadyam-viz', type:'setState', state:<id|index>, instant?}
//                 {ns:'cadyam-viz', type:'theme', mode:'light'|'dark'|'auto', vars:{--viz-…}}
//                 {ns:'cadyam-viz', type:'params', values:{name: value}}
//   frame → host  {ns:'cadyam-viz', type:'ready', states:[{id,title,description}], state, params}
//                 {ns:'cadyam-viz', type:'state', state:<id>, index}
//                 {ns:'cadyam-viz', type:'event', name, detail}   (a module's ctx.emit)
//                 {ns:'cadyam-viz', type:'size', aspect}
//
// The first state can ride in the address too: `#state=<id>&mode=dark`.
// Inert on an ordinary story page.
(function (Vizkit) {
  'use strict';
  var cfg = window.__VIZKIT_EMBED__;
  if (!cfg) return;
  var NS = 'cadyam-viz';
  var states = cfg.states || [];
  var scrolly = null, last = -1, pending = null, announced = false;
  document.documentElement.dataset.embed = 'true';

  function hashParams() {
    var out = {};
    (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) out[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return out;
  }

  function post(msg) {
    msg.ns = NS;
    if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
  }

  function indexOf(state) {
    if (typeof state === 'number') return Math.max(0, Math.min(states.length - 1, state));
    for (var i = 0; i < states.length; i++) if (states[i].id === state) return i;
    return -1;
  }

  function setState(state, instant) {
    var i = indexOf(state);
    if (i < 0) return;
    if (!scrolly) { pending = { i: i, instant: instant }; return; }
    if (instant || scrolly.reduced) scrolly.chart(i).then(function () { scrolly.show(i); });
    else scrolly.goTo(i);
  }

  function setTheme(msg) {
    var root = document.documentElement;
    // Only a real change redraws: the frame announces itself after every
    // draw, and a host answering each with its theme must not loop.
    if (msg.mode && Vizkit.setMode && root.dataset.mode !== msg.mode) Vizkit.setMode(msg.mode);
    var changed = false;
    // The host's font stylesheets, once each; canvas text needs the faces
    // loaded before it draws, so redraw when they arrive.
    (msg.fonts || []).forEach(function (href) {
      if (!/^https?:/.test(href) || document.querySelector('link[data-host-font="' + href + '"]')) return;
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      l.dataset.hostFont = href;
      l.onload = function () {
        var family = getComputedStyle(root).getPropertyValue('--viz-font').trim();
        var face = family ? '12px ' + family : null;
        (face && document.fonts ? document.fonts.load(face) : Promise.resolve()).then(function () {
          if (document.fonts) return document.fonts.ready;
        }).then(function () { if (Vizkit.redraw && !modulesOnly()) Vizkit.redraw(); });
      };
      document.head.appendChild(l);
    });
    Object.keys(msg.vars || {}).forEach(function (k) {
      if (!/^--viz-/.test(k)) return;
      var v = String(msg.vars[k]);
      if (root.style.getPropertyValue(k) === v) return;
      root.style.setProperty(k, v);
      changed = true;
    });
    // Built-in marks paint their colours once; redraw them in the new ones.
    // (A module with a frame loop reads ctx.theme every frame anyway.)
    if (changed && scrolly && !modulesOnly() && Vizkit.redraw) Vizkit.redraw();
  }

  // Every view draws through a module with a frame loop, which reads the
  // theme each frame: no redraw needed (and none wanted — it would reset
  // the module's animation).
  function modulesOnly() {
    var story = Vizkit.readStory && Vizkit.readStory();
    return !!story && story.views.every(function (v) { return v.module; });
  }

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.ns !== NS) return;
    if (m.type === 'setState') setState(m.state, m.instant);
    else if (m.type === 'theme') setTheme(m);
    else if (m.type === 'params' && Vizkit.sdk) Vizkit.sdk.setParams(m.values);
  });

  // A module's ctx.emit reaches the host as a `viz:<name>` event.
  if (Vizkit.sdk && Vizkit.sdk.onEmit) {
    Vizkit.sdk.onEmit(function (name, detail) { post({ type: 'event', name: name, detail: detail }); });
  }

  var h = hashParams();
  if (h.mode) setTheme({ mode: h.mode });

  document.addEventListener('vizkit:drawn', function () {
    scrolly = null;
    Vizkit.charts().forEach(function (c) { if (c && c.goTo && c.beats) scrolly = c; });
    if (!scrolly) return;
    scrolly.onState = function (i) {
      if (i === last) return;
      last = i;
      document.documentElement.dataset.state = (states[i] && states[i].id) || String(i);
      post({ type: 'state', state: states[i] ? states[i].id : i, index: i });
    };
    // A redraw (theme, resize) keeps the state the reader was on.
    var first = pending ? pending.i : last >= 0 ? last : indexOf(h.state != null ? h.state : 0);
    pending = null;
    last = -1;
    if (first > 0) scrolly.chart(first).then(function () { scrolly.show(first); });
    else last = 0;
    if (announced) return;
    announced = true;
    post({
      type: 'ready', states: states,
      state: states[Math.max(0, first)] ? states[Math.max(0, first)].id : 0,
      params: Vizkit.sdk && Vizkit.sdk.declaredParams ? Vizkit.sdk.declaredParams() : {},
    });
  });

  Vizkit.embed = { setState: setState, setTheme: setTheme, states: states };
})(Vizkit);
</script>
</body>
</html>
